services:
  - type: web
    name: nexus-telegram-bots
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    autoDeploy: true
    healthCheckPath: /health
    disk:
      name: nexus-bots-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production

      - key: NEXUS_ENABLE_NEXGAME
        value: "true"
      - key: NEXUS_ENABLE_NEXCANAL
        value: "true"
      - key: NEXUS_ENABLE_NEXDOWNLOADER
        value: "true"
      - key: NEXUS_ENABLE_NEXGROUP
        value: "true"
      - key: NEXUS_ENABLE_NEXSTICK
        value: "true"

      - key: NEXUS_MONGODB_URI
        sync: false
      - key: NEXUS_MONGODB_DB_NAME
        value: nexus_bots

      - key: NEXUS_CROSS_PROMO_ENABLED
        value: "true"
      - key: NEXUS_CROSS_PROMO_MIN_USES
        value: "6"
      - key: NEXUS_CROSS_PROMO_COOLDOWN_DAYS
        value: "5"

      - key: NEXGAME__BOT_TOKEN
        sync: false
      - key: NEXGAME__REDIS_URL
        sync: false
      - key: NEXGAME__WEBHOOK_SECRET
        generateValue: true
      - key: NEXGAME__PAYMENT_SIGNING_SECRET
        generateValue: true
      - key: NEXGAME__INTERNAL_OWNER_IDS
        sync: false

      - key: NEXCANAL__BOT_TOKEN
        sync: false
      - key: NEXCANAL__WEBHOOK_SECRET
        generateValue: true
      - key: NEXCANAL__NEXCANAL_INTERNAL_ADMIN_IDS
        sync: false

      - key: NEXDOWNLOADER__BOT_TOKEN
        sync: false
      - key: NEXDOWNLOADER__OWNER_TELEGRAM_ID
        sync: false

      - key: NEXGROUP__TELEGRAM_BOT_TOKEN
        sync: false
      - key: NEXGROUP__TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: NEXGROUP__TELEGRAM_API_ID
        sync: false
      - key: NEXGROUP__TELEGRAM_API_HASH
        sync: false
      - key: NEXGROUP__NEXGROUP_OWNER_ID
        sync: false

      - key: NEXSTICK__BOT_TOKEN
        sync: false
      - key: NEXSTICK__ADMIN_IDS
        sync: false
