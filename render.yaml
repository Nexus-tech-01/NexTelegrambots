services:
  - type: web
    name: nexus-telegram-bots
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: NEXUS_COMMAND_GATEWAY_KEY
        sync: false
    disk:
      name: nexus-bots-data
      mountPath: /var/data
      sizeGB: 1
