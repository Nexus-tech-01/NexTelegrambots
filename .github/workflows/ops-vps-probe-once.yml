name: Ops VPS Probe Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-vps-probe-once.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Clean safe caches
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error "https://ojbyvjqurlamplmujmyu.supabase.co/functions/v1/nxc-safe-cache-clean-once"

      - name: Remove redundant startup package install and restart
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error "https://ojbyvjqurlamplmujmyu.supabase.co/functions/v1/nxc-clear-nodepackages-restart-once"

      - name: Wait for restart
        run: sleep 25

      - name: Reassert main file and start
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error "https://ojbyvjqurlamplmujmyu.supabase.co/functions/v1/nxc-ptero-mainfile-repair"

      - name: Wait for boot
        run: sleep 25

      - name: Verify VPS runtime state
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error "https://ojbyvjqurlamplmujmyu.supabase.co/functions/v1/nxc-ptero-read-nexmeta-runtime-once"

      - name: Capture startup console
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error "https://ojbyvjqurlamplmujmyu.supabase.co/functions/v1/nxc-ptero-console-live"

