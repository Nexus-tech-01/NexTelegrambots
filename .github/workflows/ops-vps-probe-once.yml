name: Ops VPS Probe Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-vps-probe-once.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Clean safe caches
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error "https://ojbyvjqurlamplmujmyu.supabase.co/functions/v1/nxc-safe-cache-clean-once"
      - name: Start VPS server
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error "https://ojbyvjqurlamplmujmyu.supabase.co/functions/v1/nxc-ptero-mainfile-repair"
      - name: Wait for boot
        run: sleep 18
      - name: Verify VPS runtime state
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error             "https://ojbyvjqurlamplmujmyu.supabase.co/functions/v1/nxc-ptero-read-nexmeta-runtime-once"

