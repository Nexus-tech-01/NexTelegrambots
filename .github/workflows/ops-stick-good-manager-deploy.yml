name: Ops Stick Good Manager Deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-stick-good-manager-deploy.yml'
      - 'nexcanal/stick-good-core.mjs'
      - 'nexcanal/stick-good-manager.mjs'
      - 'nexcanal/stick-good-manager.contract.test.mjs'
      - 'whatsapp-publisher/server.mjs'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: ops-stick-good-manager-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - name: Validate Stick Good isolation and contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check nexcanal/stick-good-core.mjs
          node --check nexcanal/stick-good-manager.mjs
          node --check whatsapp-publisher/server.mjs
          node nexcanal/stick-good-manager.contract.test.mjs
          python3 - <<'PY'
          from pathlib import Path
          manager=Path('nexcanal/stick-good-manager.mjs').read_text()
          for required in (
              "async function visuallyMatches(character,filePath)",
              "Identifie indépendamment le personnage principal visible",
              "if(!(await visuallyMatches(character,target)))continue;",
              "Number(j.confidence)>=0.84",
              "STICK_GOOD_PORT||18815",
              "2*60*60_000",
              "12*60*60_000",
              "MAX_STICKERS=30",
          ):
              if required not in manager:
                  raise SystemExit('manager missing '+required)
          print('STICK_GOOD_VISUAL_GATE_OK')
          PY

      - name: Deploy to VPS with GitHub OIDC
        shell: bash
        env:
          DEPLOY_ENDPOINT: https://ojbyvjqurlamplmujmyu.supabase.co/functions/v1/nxc-complete-utf8-61082
        run: |
          set -euo pipefail
          OIDC_JSON="$(curl --fail-with-body --silent --show-error             -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=nxc-stick-good-deploy")"
          OIDC_TOKEN="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$OIDC_JSON")"
          test -n "$OIDC_TOKEN"

          curl --fail-with-body --silent --show-error             -X POST "$DEPLOY_ENDPOINT"             -H "Authorization: Bearer $OIDC_TOKEN"             -H "Content-Type: application/json"             --data "{\"sha\":\"${GITHUB_SHA}\"}"             | tee /tmp/stick-good-deploy.json

          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/stick-good-deploy.json')
          data=json.loads(p.read_text())
          if data.get('ok') is not True:
              raise SystemExit('deployment did not confirm ok=true')
          if data.get('rules',{}).get('visualCharacterGate') is not True:
              raise SystemExit('visual character gate not confirmed')
          Path('ops-results').mkdir(parents=True,exist_ok=True)
          Path('ops-results/stick-good-manager.json').write_text(
              json.dumps(data,indent=2,sort_keys=True)+'\n',encoding='utf-8'
          )
          print('STICK_GOOD_PRODUCTION_OK')
          PY

      - name: Commit production verification report
        shell: bash
        run: |
          set -euo pipefail
          test -f ops-results/stick-good-manager.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops-results/stick-good-manager.json
          if ! git diff --cached --quiet; then
            git commit -m "ops: record Stick Good production verification"
            git push origin HEAD:main
          fi
