name: Ops WhatsApp CTA Deploy Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-whatsapp-cta-deploy-once.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate NexTech WhatsApp CTA path
        shell: bash
        run: |
          set -euo pipefail
          node --check nexcanal/nextech-whatsapp-mirror.mjs
          node --check internal-automation/interroute.mjs
          node --check whatsapp-publisher/server.mjs
          python3 - <<'PY'
          from pathlib import Path
          mirror=Path('nexcanal/nextech-whatsapp-mirror.mjs').read_text()
          inter=Path('internal-automation/interroute.mjs').read_text()
          wa=Path('whatsapp-publisher/server.mjs').read_text()
          checks={
            'telegram_reply_markup': "message?.reply_markup" in mirror,
            'telegram_message_buttons': "message?.buttons" in mirror,
            'buttons_preserved_to_interroute': "buttons:e.content.buttons" in inter,
            'cta_url': "name:'cta_url'" in wa,
            'merchant_url': "merchant_url:b.url" in wa,
            'interactive_header': "hasMediaAttachment:false" in wa,
            'cta_fallback': "linksText(buttons)" in wa,
          }
          print(checks)
          if not all(checks.values()):
              raise SystemExit('CTA pipeline assertion failed')
          PY
