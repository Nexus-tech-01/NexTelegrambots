name: Ops WhatsApp CTA Deploy Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-whatsapp-cta-deploy-once.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect WhatsApp runtime paths
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,urllib.parse,urllib.request
          base='https://ojbyvjqurlamplmujmyu.supabase.co/functions/v1/nxc-ptero-startfiles-read'
          for d in ['/whatsapp-publisher','/data','/nexcanal']:
              try:
                  url=base+'?dir='+urllib.parse.quote(d,safe='')
                  with urllib.request.urlopen(url,timeout=45) as r:
                      obj=json.load(r)
                  print(json.dumps(obj,ensure_ascii=False))
              except Exception as e:
                  print(json.dumps({'dir':d,'error':str(e)},ensure_ascii=False))
          PY

