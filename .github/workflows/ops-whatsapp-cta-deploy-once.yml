name: Ops WhatsApp CTA Deploy Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-whatsapp-cta-deploy-once.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect live bridge files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,urllib.parse,urllib.request
          base='https://ojbyvjqurlamplmujmyu.supabase.co/functions/v1/nxc-ptero-browser-files-probe'
          roots=['/nexus-bridge','/services','/pterodactyl','/ecosystem']
          for root in roots:
              with urllib.request.urlopen(base+'?root='+urllib.parse.quote(root,safe=''),timeout=120) as r:
                  d=json.load(r)
              print(json.dumps({'root':root,'fileList':d.get('fileList',[])},ensure_ascii=False))
          PY
