name: Ops WhatsApp CTA Deploy Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-whatsapp-cta-deploy-once.yml'

permissions:
  contents: read

jobs:
  agents:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Locate active NexControl agents
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --max-time 45 \
            "https://ojbyvjqurlamplmujmyu.supabase.co/functions/v1/nxc-chatgpt-diag-once" \
            -o /tmp/agents.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/agents.json'))
          print(json.dumps({
            'ok':d.get('ok'),
            'now':d.get('now'),
            'agents':d.get('agents',[]),
            'jobs':d.get('jobs',[])[:12]
          },ensure_ascii=False))
          PY
