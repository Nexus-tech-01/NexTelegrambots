name: Deploy NexAI Connect

on:
  push:
    branches: [main]
    paths:
      - 'nexai-connect-site/**'
      - '.github/workflows/deploy-nexai-connect.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-nexai-connect
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_SCOPE: tresorhtn-1071s-projects
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      NEXCONTROL_SESSION_SECRET: ${{ secrets.NEXCONTROL_SESSION_SECRET || secrets.SESSION_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate required credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}" || { echo "VERCEL_TOKEN secret is missing"; exit 2; }
          test -n "${NEXCONTROL_SESSION_SECRET:-}" || { echo "NEXCONTROL_SESSION_SECRET/SESSION_SECRET is missing"; exit 3; }

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Create or link dedicated Vercel project
        working-directory: nexai-connect-site
        shell: bash
        run: |
          set -euo pipefail
          vercel project add nexai-connect --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null 2>&1 || true
          vercel link --yes --project nexai-connect --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"

      - name: Sync production pairing secret
        working-directory: nexai-connect-site
        shell: bash
        run: |
          set -euo pipefail
          vercel env rm NEXCONTROL_SESSION_SECRET production --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null 2>&1 || true
          printf '%s' "$NEXCONTROL_SESSION_SECRET" | vercel env add NEXCONTROL_SESSION_SECRET production --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"

      - name: Deploy production
        id: deploy
        working-directory: nexai-connect-site
        shell: bash
        run: |
          set -euo pipefail
          URL="$(vercel deploy --prod --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN")"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "NEXAI_CONNECT_URL=$URL"

      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          URL="${{ steps.deploy.outputs.url }}"
          curl --fail --silent --show-error --location --retry 4 --retry-delay 2 "$URL/" | grep -q "NexAI Connect"
          curl --fail --silent --show-error --retry 3 "$URL/api/nexai/health" >/tmp/health.json || true
          cat /tmp/health.json 2>/dev/null || true
