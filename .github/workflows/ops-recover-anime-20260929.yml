name: Ops Recover Anime Publishing 2026-09-29

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ops-recover-anime-20260929.yml'

permissions:
  contents: read

concurrency:
  group: ops-recover-anime-20260929
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Run one-shot anime recovery bridge
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl --fail-with-body --silent --show-error --max-time 420 'https://ojbyvjqurlamplmujmyu.supabase.co/functions/v1/nxc-ptero-import-once')"
          echo "$body"
          python3 - "$body" <<'PY'
          import json,sys
          d=json.loads(sys.argv[1])
          if d.get("ok") is not True:
              raise SystemExit("anime recovery failed: "+str(d))
          if d.get("publisherActive") is not True:
              raise SystemExit("anime publisher not active after recovery")
          if d.get("statusHealthy") is not True:
              raise SystemExit("anime status unhealthy after recovery")
          print("NEXANIME_RECOVERY_OK", json.dumps({
              "publicationTriggered":d.get("publicationTriggered"),
              "lastPublishedAt":d.get("lastPublishedAt"),
              "destination":d.get("destination")
          },separators=(",",":")))
          PY
