name: Diagnose NexGroup Settings Loop

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-nexgroup-settings-loop-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Search live NexGroup source through temporary internal proxy
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            "https://ojbyvjqurlamplmujmyu.supabase.co/functions/v1/nxc-ptero-console-once" |
          python3 -c 'import sys,json; d=json.load(sys.stdin); print(json.dumps(d,ensure_ascii=False,indent=2))'

