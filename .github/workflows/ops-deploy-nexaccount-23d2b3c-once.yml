name: Ops Deploy NexAccount Menu Fix Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-deploy-nexaccount-23d2b3c-once.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy NexAccount menu fix to VPS
        shell: bash
        run: |
          set -euo pipefail
          resp="$(curl --silent --show-error --max-time 300 -w '\n%{http_code}' 'https://ojbyvjqurlamplmujmyu.supabase.co/functions/v1/nxc-ptero-import-once')"
          code="$(printf '%s' "$resp" | tail -n1)"
          body="$(printf '%s' "$resp" | sed '$d')"
          echo "HTTP $code"
          echo "$body"
          python3 - "$body" <<'PY'
          import json,sys
          data=json.loads(sys.argv[1])
          if data.get("ok") is not True:
              raise SystemExit("deployment did not report ok=true: "+str(data))
          if data.get("commit")!="77d5f8e43efa6da37365436e023db7af5176ae55":
              raise SystemExit("wrong deployed commit: "+str(data.get("commit")))
          if data.get("alreadyDone") is not True:
              written=data.get("written") or []
              if len(written) < 2:
                  raise SystemExit("expected runtime + bot-factory writes: "+str(written))
              if data.get("afterState")!="running":
                  raise SystemExit("VPS is not running after deployment: "+str(data))
          print("MENU_FIX_DEPLOY_OK",data)
          PY

      - name: Verify VPS console after deployment
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error 'https://ojbyvjqurlamplmujmyu.supabase.co/functions/v1/nxc-ptero-console-live'
