name: Ops Deploy NexAccount Premium Powers Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-deploy-nexaccount-23d2b3c-once.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Deploy NexAccount Premium Powers to VPS
        shell: bash
        run: |
          set -euo pipefail
          resp="$(curl --silent --show-error --max-time 180 -w '\n%{http_code}' 'https://ojbyvjqurlamplmujmyu.supabase.co/functions/v1/nxc-ptero-import-once')"
          code="$(printf '%s' "$resp" | tail -n1)"
          body="$(printf '%s' "$resp" | sed '$d')"
          echo "HTTP $code"
          echo "$body"
          python3 - "$body" <<'PY'
          import json,sys
          data=json.loads(sys.argv[1])
          if data.get("ok") is not True:
              raise SystemExit("deployment did not report ok=true: "+str(data))
          if data.get("commit")!="ee242699fdc07cda63fd34fdede0f1443b24b51a":
              raise SystemExit("wrong deployed commit: "+str(data.get("commit")))
          if data.get("alreadyDone") is not True:
              written=data.get("written") or []
              if len(written) < 6:
                  raise SystemExit("expected Premium Powers runtime writes: "+str(written))
          print("PREMIUM_POWERS_FILES_OK",data)
          PY

      - name: Wait for VPS to become running
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 48); do
            body="$(curl --fail-with-body --silent --show-error --max-time 20 'https://ojbyvjqurlamplmujmyu.supabase.co/functions/v1/nxc-ptero-import-once')"
            echo "$body"
            state="$(python3 - "$body" <<'PY'
          import json,sys
          d=json.loads(sys.argv[1])
          print(d.get("currentState") or d.get("afterState") or "")
          PY
          )"
            if [ "$state" = "running" ]; then
              echo "VPS_RUNNING"
              exit 0
            fi
            sleep 4
          done
          echo "VPS did not reach running state in time" >&2
          exit 1

      - name: Verify VPS console after deployment
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error 'https://ojbyvjqurlamplmujmyu.supabase.co/functions/v1/nxc-ptero-console-live'

