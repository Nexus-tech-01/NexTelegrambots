name: Social relays infrastructure health probe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/social-relays-health-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify existing deployment pathways without changing VPS
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,urllib.request,urllib.error
          checks={
            'pterodactyl_resource':'https://ojbyvjqurlamplmujmyu.supabase.co/functions/v1/nxc-ptero-diag',
            'pterodactyl_root':'https://ojbyvjqurlamplmujmyu.supabase.co/functions/v1/nxc-ptero-root-list-live',
            'pterodactyl_services':'https://ojbyvjqurlamplmujmyu.supabase.co/functions/v1/nxc-ptero-startfiles-read?dir=%2Fservices',
            'nexcontrol_web':'https://nexcontrol-ochre.vercel.app/api/health'
          }
          for name,url in checks.items():
            try:
              with urllib.request.urlopen(urllib.request.Request(url,headers={'user-agent':'Nextech-relay-health/1.0'}),timeout=25) as resp:
                data=json.loads(resp.read(500000))
                out={'status':resp.status,'ok':data.get('ok')}
                if name=='pterodactyl_resource':
                  out.update({'state':data.get('state'),'downloadStatus':data.get('downloadStatus'),'rangeStatus':data.get('rangeStatus')})
                elif name=='pterodactyl_root':
                  out['dirs']=[v.get('name') for v in data.get('files',[]) if any(s in str(v.get('name','')).lower() for s in ('service','whatsapp','nex','bot','infra'))][:30]
                elif name=='pterodactyl_services':
                  out['entries']=[v.get('name') for v in data.get('entries',[]) if any(s in str(v.get('name','')).lower() for s in ('whatsapp','nex','interroute','meta','facebook'))][:30]
                else:
                  out['service']=str(data.get('service') or data.get('status') or '')[:120]
                print('PROBE',name,json.dumps(out,ensure_ascii=False),flush=True)
            except urllib.error.HTTPError as e:
              print('PROBE',name,'HTTP',e.code,flush=True)
            except Exception as e:
              print('PROBE',name,type(e).__name__,str(e)[:220],flush=True)
          PY
