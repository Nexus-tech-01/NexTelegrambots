name: Ops NexAI Reply Restart Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-nexai-reply-videonote-deploy-once.yml'

permissions:
  contents: read

jobs:
  restart:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Restart NexAI VPS through existing Pterodactyl relay
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl --fail-with-body --silent --show-error --max-time 45 'https://ojbyvjqurlamplmujmyu.supabase.co/functions/v1/nxc-chatgpt-recover-once')"
          echo "$body"
          python3 - "$body" <<'PY'
          import json,sys
          d=json.loads(sys.argv[1])
          if d.get("ok") is not True:
              raise SystemExit("restart failed: "+str(d))
          status=int(d.get("status") or 0)
          if status not in (200,202,204):
              raise SystemExit("unexpected restart status: "+str(d))
          print("NEXAI_PTERODACTYL_RESTART_SENT",d)
          PY

