name: Ops NexAI Reply Video Note Direct Deploy Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-nexai-reply-videonote-deploy-once.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Deploy NexAI reply video-note directly through Pterodactyl relay
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl --fail-with-body --silent --show-error --max-time 120 'https://ojbyvjqurlamplmujmyu.supabase.co/functions/v1/nxc-chatgpt-meta-once')"
          echo "$body"
          python3 - "$body" <<'PY'
          import json,sys
          d=json.loads(sys.argv[1])
          if d.get("ok") is not True:
              raise SystemExit("Direct VPS deploy failed: "+str(d))
          if "commands.mjs" not in (d.get("written") or []) or "runtime.mjs" not in (d.get("written") or []):
              raise SystemExit("Expected NexAI files not confirmed: "+str(d))
          print("NEXAI_REPLY_VIDEONOTE_DEPLOYED",d)
          PY

