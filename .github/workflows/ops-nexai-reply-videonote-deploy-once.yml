name: Ops NexAI Reply Video Note Agent Recovery Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-nexai-reply-videonote-deploy-once.yml'

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Restart VPS agent host through existing recovery relay
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl --fail-with-body --silent --show-error --max-time 30 'https://ojbyvjqurlamplmujmyu.supabase.co/functions/v1/nxc-chatgpt-recover-once')"
          echo "$body"
          python3 - "$body" <<'PY'
          import json,sys
          d=json.loads(sys.argv[1])
          if d.get("ok") is not True:
              raise SystemExit("VPS recovery did not report ok=true: "+str(d))
          print("VPS_RECOVERY_TRIGGERED",d)
          PY

