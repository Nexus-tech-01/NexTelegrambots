name: Ops NexAI Reply Telegram Storage Deploy Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-nexai-reply-videonote-deploy-once.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Invoke temporary VPS deployment relay
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl --fail-with-body --silent --show-error --max-time 240 'https://ojbyvjqurlamplmujmyu.supabase.co/functions/v1/nxc-chatgpt-meta-once?token=REPLYFIX_20261003_8e1d6c0fb37b4e25a912')"
          echo "$body"
          python3 - "$body" <<'PY'
          import json,sys
          d=json.loads(sys.argv[1])
          if d.get("ok") is not True:
              raise SystemExit("NexAI reply deployment failed: "+str(d))
          if d.get("commit")!="3b9677b88ae6574d1adf4b969ffdb580663f09f2":
              raise SystemExit("wrong deployed commit: "+str(d.get("commit")))
          written=d.get("written") or []
          if "compat.mjs" not in written or "runtime.mjs" not in written:
              raise SystemExit("required files not confirmed: "+str(written))
          health=d.get("health") or {}
          if health.get("ok") is not True or health.get("pairingOnly") is True:
              raise SystemExit("runtime health not confirmed: "+str(health))
          print("NEXAI_REPLY_TELEGRAM_STORAGE_LIVE",d.get("steps"))
          PY

# invoke-reply-storage-relay-20261003
