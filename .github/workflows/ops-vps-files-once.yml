name: Ops VPS Files Once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-vps-files-once.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect files
        shell: bash
        run: |
          set -euo pipefail
          for d in "%2F" "%2F.nexcontrol" "%2F.nexcontrol%2Fbackups" "%2F.nexcontrol%2Flogs" "%2Fbots%2Fnexaccount" "%2Fbots%2Fnexaccount%2F.runtime" "%2Fnode_modules" "%2Fdata" "%2Ftmp"; do
            echo "=== $d ==="
            curl -fsS "https://ojbyvjqurlamplmujmyu.supabase.co/functions/v1/nxc-ptero-startfiles-read?dir=$d" || true
            echo
          done

