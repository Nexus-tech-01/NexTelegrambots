name: Ops VPS Files Once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-vps-files-once.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect safe disk targets
        shell: bash
        run: |
          set -euo pipefail
          for d in "%2Fdata" "%2F.local" "%2F.nexmeta-browser-profile" "%2F.cache" "%2F.npm" "%2F.nexcontrol"; do
            echo "=== $d ==="
            curl -fsS "https://ojbyvjqurlamplmujmyu.supabase.co/functions/v1/nxc-ptero-startfiles-read?dir=$d" || true
            echo
          done
# take-repair-shallow-safe-targets
