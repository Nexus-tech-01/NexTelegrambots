name: Deploy NexControl to Vercel

on:
  push:
    branches: [main]
    paths:
      - 'nexcontrol/**'
      - '.github/workflows/deploy-nexcontrol-vercel.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexcontrol-vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Vercel token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: test -n "$VERCEL_TOKEN"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull production environment
        working-directory: nexcontrol
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_DeK4L6JW10CIXpHARpkMQQr8
          VERCEL_PROJECT_ID: prj_SNuxI5eg0byszLYtXTfPXZC3S5VK
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        working-directory: nexcontrol
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_DeK4L6JW10CIXpHARpkMQQr8
          VERCEL_PROJECT_ID: prj_SNuxI5eg0byszLYtXTfPXZC3S5VK
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy production
        working-directory: nexcontrol
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_DeK4L6JW10CIXpHARpkMQQr8
          VERCEL_PROJECT_ID: prj_SNuxI5eg0byszLYtXTfPXZC3S5VK
        run: vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN"
