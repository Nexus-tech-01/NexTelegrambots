name: Emergency NexControl Vercel repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nexcontrol-vercel-repair.yml'
      - 'nexcontrol/**'

permissions:
  contents: read

concurrency:
  group: nexcontrol-vercel-repair
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: team_DeK4L6JW10CIXpHARpkMQQr8
      VERCEL_PROJECT_ID: prj_SNuxI5eg0byszLYtXTfPXZC3S5VK
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN || secrets.VERCEL_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify Vercel credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}" || { echo "VERCEL_TOKEN_MISSING"; exit 2; }
      - name: Deploy NexControl production
        shell: bash
        working-directory: nexcontrol
        run: |
          set -euo pipefail
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
      - name: Verify public health
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..12}; do
            body="$(curl -fsS --max-time 20 https://nexcontrol-ochre.vercel.app/api/health || true)"
            echo "$body"
            if echo "$body" | grep -q '"version":"61.12-control-link"'; then exit 0; fi
            sleep 5
          done
          exit 1
