          echo "=== CONSOLE ==="
          curl --silent --show-error --max-time 30 "https://ojbyvjqurlamplmujmyu.supabase.co/functions/v1/nxc-ptero-console-live" || true
          echo
          echo "=== PTERO DIAG ==="
          curl --silent --show-error --max-time 30 "https://ojbyvjqurlamplmujmyu.supabase.co/functions/v1/nxc-ptero-diag" || true
          echo
