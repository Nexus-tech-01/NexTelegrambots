name: Ops VPS Console Once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-vps-console-once.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fix Pterodactyl readiness state
        run: |
          set -euo pipefail
          body="$(curl --fail-with-body --silent --show-error --max-time 150 "https://ojbyvjqurlamplmujmyu.supabase.co/functions/v1/nxc-ptero-import-once")"
          echo "$body"
          python3 - "$body" <<'PY'
          import json,sys
          d=json.loads(sys.argv[1])
          assert d.get("ok") is True, d
          assert d.get("state")=="running", d
          print("PTERO_READY_OK", d.get("state"), "changed", d.get("changed"))
          PY
# ptero-ready-marker-fix-v31
