name: Ops VPS Console Once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-vps-console-once.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect NexAI Premium Powers startup
        shell: bash
        run: |
          set -u
          echo "=== DEPLOY STATE ==="
          curl --silent --show-error --max-time 30 "https://ojbyvjqurlamplmujmyu.supabase.co/functions/v1/nxc-ptero-import-once" || true
