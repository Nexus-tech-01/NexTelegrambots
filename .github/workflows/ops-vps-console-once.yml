name: Ops VPS Console Once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-vps-console-once.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify NexAI poller after clean restart
        run: |
          set -euo pipefail
          body="$(curl --fail-with-body --silent --show-error --max-time 45 "https://ojbyvjqurlamplmujmyu.supabase.co/functions/v1/nxc-ptero-import-once")"
          echo "$body"
          python3 - "$body" <<'PY'
          import json,sys
          d=json.loads(sys.argv[1])
          assert d.get("ok") is True, d
          assert d.get("singleton") is True or d.get("standby") is True, d
          print("POLLER_STATE", "singleton" if d.get("singleton") else "standby", "conflicts", d.get("conflicts"), "state", d.get("state"))
          PY
# nexai-poll409-postrestart-verify-v27
