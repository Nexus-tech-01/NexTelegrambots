name: Ops VPS Console Once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-vps-console-once.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect boot
        run: |
          curl -fsS "https://ojbyvjqurlamplmujmyu.supabase.co/functions/v1/nxc-ptero-read-nexmeta-runtime-once"
          echo
          curl -fsS "https://ojbyvjqurlamplmujmyu.supabase.co/functions/v1/nxc-ptero-console-live"
          echo
          curl -fsS "https://ojbyvjqurlamplmujmyu.supabase.co/functions/v1/nxc-puppeteer-cache-status"
          echo
          for root in "%2Fdata" "%2F.local" "%2F.nexmeta-browser-profile" "%2Fbots"; do
            echo "=== SIZE $root ==="
            curl -fsS "https://ojbyvjqurlamplmujmyu.supabase.co/functions/v1/nxc-ptero-browser-files-probe?root=$root" || true
            echo
          done

