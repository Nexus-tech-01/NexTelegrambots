name: Deploy NexAccount
# ops trigger: recover anime publication runtime 2026-09-28

on:
  push:
    branches: [main]
    paths:
      - 'nexaccount/**'
      - 'nexcanal/**'
      - 'nexcontrol/api/index.mjs'
      - '.github/workflows/deploy-nexaccount.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-nexaccount
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NXC_BASE: https://nexcontrol-ochre.vercel.app
      NXC_AGENT: nexus-main
      NXC_ADMIN_PASSWORD: ${{ secrets.NEXCONTROL_ADMIN_PASSWORD || secrets.ADMIN_PASSWORD }}
      NXC_SESSION_SECRET: ${{ secrets.NEXCONTROL_SESSION_SECRET || secrets.SESSION_SECRET }}
    steps:
      - name: Checkout Nexus bots
        uses: actions/checkout@v4

      - name: Checkout THE BIG DIPPER
        uses: actions/checkout@v4
        with:
          repository: Tresor562/DIPPER-
          path: _dipper

      - name: Sync Dipper styles
        run: node nexaccount/scripts/sync-dipper.mjs _dipper nexaccount

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install NexAccount dependencies
        run: npm install --prefix nexaccount --ignore-scripts

      - name: Full NexAccount public stability gate
        run: npm --prefix nexaccount run check

      - name: NexControl API syntax
        run: node --check nexcontrol/api/index.mjs

      - name: Deploy through NexControl Agent
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,time,urllib.request,urllib.error,urllib.parse,http.cookiejar,hmac,hashlib,base64
          from pathlib import Path

          BASE=os.environ['NXC_BASE'].rstrip('/')
          AGENT=os.environ['NXC_AGENT']
          ADMIN=os.environ.get('NXC_ADMIN_PASSWORD','')
          SECRET=os.environ.get('NXC_SESSION_SECRET','')

          jar=http.cookiejar.CookieJar()
          op=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          cookie=''
          if SECRET:
              exp=int(time.time()*1000)+30*60*1000
              payload=base64.urlsafe_b64encode(json.dumps({'exp':exp},separators=(',',':')).encode()).decode().rstrip('=')
              sig=base64.urlsafe_b64encode(hmac.new(SECRET.encode(),payload.encode(),hashlib.sha256).digest()).decode().rstrip('=')
              cookie=payload+'.'+sig
          elif ADMIN:
              data=urllib.parse.urlencode({'password':ADMIN}).encode()
              op.open(urllib.request.Request(BASE+'/api/admin/login',data=data,headers={'Content-Type':'application/x-www-form-urlencoded'},method='POST'),timeout=45).read()
          else:
              raise RuntimeError('No NexControl credential in Actions secrets')

          def http(method,path,data=None,timeout=60):
              headers={'Accept':'application/json'}
              if cookie: headers['Cookie']='nexcontrol_session='+cookie
              body=None
              if data is not None:
                  body=json.dumps(data,separators=(',',':')).encode()
                  headers['Content-Type']='application/json'
              req=urllib.request.Request(BASE+path,data=body,headers=headers,method=method)
              try:
                  with op.open(req,timeout=timeout) as r:
                      raw=r.read().decode('utf-8','replace')
                      return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  raise RuntimeError(f'HTTP {e.code} {path}: '+e.read().decode('utf-8','replace')[:2000])

          def job(kind,payload,timeout=180):
              j=http('POST','/api/admin/agent/jobs',{'agentSlug':AGENT,'kind':kind,'payload':payload})
              jid=j.get('jobId')
              if not jid: raise RuntimeError(f'No jobId for {kind}: {j}')
              end=time.time()+timeout
              while time.time()<end:
                  x=http('GET','/api/admin/agent/jobs?id='+urllib.parse.quote(jid),timeout=45)
                  st=x.get('status')
                  if st=='succeeded': return x.get('result') or {}
                  if st=='failed': raise RuntimeError(f'{kind} failed: {x.get("error")}')
                  time.sleep(1)
              raise TimeoutError(f'{kind} timeout: {jid}')

          job('fs.mkdir',{'root':'nexus','path':'bots/nexaccount','recursive':True})
          job('fs.mkdir',{'root':'nexus','path':'bots/nexaccount/automation','recursive':True})

          files=[]
          for p in Path('nexaccount').rglob('*'):
              if not p.is_file(): continue
              if any(part in {'node_modules','.runtime'} for part in p.parts): continue
              rel=p.relative_to('nexaccount').as_posix()
              files.append((p,rel))

          backups=[]
          try:
              # NexTech APK watcher is embedded into the already connected
              # @tresor20009 NexAccount runtime. Copy the canonical modules to
              # the production-local automation directory; no second user
              # Telegram session is started.
              for src_name,dst_name in (
                  ('nexcanal/liteapks-relay.mjs','liteapks-relay.mjs'),
                  ('nexcanal/internal-event-core.mjs','internal-event-core.mjs'),
                  ('nexcanal/social-feed.mjs','social-feed.mjs'),
              ):
                  src=Path(src_name)
                  if not src.exists():
                      raise RuntimeError('missing embedded watcher source: '+src_name)
                  result=job('fs.write',{
                      'root':'nexus',
                      'path':'bots/nexaccount/automation/'+dst_name,
                      'content':src.read_text(encoding='utf-8')
                  })
                  backups.append(('automation/'+dst_name,result.get('backupId'),result.get('created',False)))

              for src,rel in files:
                  text=src.read_text(encoding='utf-8')
                  result=job('fs.write',{'root':'nexus','path':'bots/nexaccount/'+rel,'content':text})
                  backups.append((rel,result.get('backupId'),result.get('created',False)))
              install=job('runtime.exec',{
                  'root':'nexus',
                  'command':'npm',
                  'args':['--prefix','bots/nexaccount','install','--omit=dev','--ignore-scripts'],
                  'timeoutMs':180000
              },timeout=210)
              if install.get('ok') is False:
                  raise RuntimeError('npm install failed: '+str(install)[-4000:])
              for embedded in ('liteapks-relay.mjs','internal-event-core.mjs','social-feed.mjs'):
                  ck=job('check.run',{
                      'check':'node-check',
                      'root':'nexus',
                      'file':'bots/nexaccount/automation/'+embedded,
                      'timeoutMs':60000
                  })
                  if not ck.get('ok'):
                      raise RuntimeError('embedded watcher node-check failed '+embedded+': '+str(ck))
              boot=job('runtime.exec',{
                  'root':'nexus',
                  'command':'node',
                  'args':['bots/nexaccount/bootstrap.mjs','--restart','--production'],
                  'timeoutMs':60000
              },timeout=90)
              if boot.get('ok') is False:
                  raise RuntimeError('bootstrap failed: '+str(boot)[-4000:])
              health=job('runtime.exec',{
                  'root':'nexus',
                  'command':'node',
                  'args':['bots/nexaccount/cli.mjs','health'],
                  'timeoutMs':30000
              },timeout=60)
              health_text=health.get('stdout','').strip()
              print('NEXACCOUNT_HEALTH',health_text[-5000:])
              health_json=json.loads(health_text or '{}')
              if health_json.get('pairingOnly') is True:
                  raise RuntimeError('production NexAccount started in pairing-only mode')
              accounts=job('runtime.exec',{
                  'root':'nexus',
                  'command':'node',
                  'args':['bots/nexaccount/cli.mjs','accounts'],
                  'timeoutMs':30000
              },timeout=60)
              accounts_text=accounts.get('stdout','').strip()
              account_json=json.loads(accounts_text or '{}')
              active=account_json.get('runtimes') or []
              by_name={str(x.get('username') or '').lower().lstrip('@'):x for x in active if x.get('connected') is True}
              primary=by_name.get('tresor20001')
              if not primary:
                  raise RuntimeError('required primary anime runtime is not active: @tresor20001')
              primary_anime=primary.get('anime') or {}
              if primary_anime.get('listener') is not True or primary_anime.get('publisher') is not True:
                  raise RuntimeError('@tresor20001 must be anime listener+publisher: '+str(primary_anime))

              scanner=by_name.get('tresor20009')
              if not scanner:
                  raise RuntimeError('required APK/anime scanner is not active: @tresor20009')
              scanner_anime=scanner.get('anime') or {}
              if scanner_anime.get('listener') is not True:
                  raise RuntimeError('@tresor20009 must be an anime listener: '+str(scanner_anime))
              lite=scanner.get('liteApks') or {}
              if lite.get('scanner') is not True or lite.get('running') is not True:
                  raise RuntimeError('@tresor20009 embedded LiteAPK scanner is not running: '+str(lite))

              probe_row=by_name.get('tresor20001') or next((x for x in active if x.get('connected') is True),None)
              if not probe_row or not probe_row.get('telegramUserId'):
                  raise RuntimeError('no connected NexAccount runtime available for inline menu probe')
              menu_probe=job('runtime.exec',{
                  'root':'nexus',
                  'command':'node',
                  'args':['bots/nexaccount/cli.mjs','menu-probe',str(probe_row.get('telegramUserId'))],
                  'timeoutMs':30000
              },timeout=60)
              probe_text=menu_probe.get('stdout','').strip()
              probe_json=json.loads(probe_text or '{}')
              if probe_json.get('ok') is not True or not probe_json.get('resultId'):
                  raise RuntimeError('NexAI inline menu probe failed: '+str(probe_json))
              print('NEXAI_INLINE_MENU_OK',probe_json)

              engines=job('runtime.exec',{
                  'root':'nexus',
                  'command':'node',
                  'args':['bots/nexaccount/cli.mjs','engines'],
                  'timeoutMs':30000
              },timeout=60)
              engines_text=engines.get('stdout','').strip()
              engines_json=json.loads(engines_text or '{}')
              engine_rows={str(x.get('service')):x for x in (engines_json.get('engines') or [])}
              for required in ('download','group','sticker','game','anime','audio'):
                  row=engine_rows.get(required) or {}
                  if row.get('configured') is not True or row.get('reachable') is not True:
                      raise RuntimeError('required NexAI engine not ready: '+required+' '+str(row))
              ai=engine_rows.get('ai') or {}
              if ai.get('configured') is not True or ai.get('reachable') is not True:
                  print('WARNING NexAI AI provider is not configured/reachable:',ai)
              else:
                  print('NEXAI_AI_OK',ai)

              print('AUTOMATIONS_OK @tresor20001 anime publisher + @tresor20009 anime/APK scanner')
              print('DEPLOYMENT_OK NexAccount')
          except Exception:
              for rel,bid,created in reversed(backups):
                  try:
                      if bid: job('fs.rollback',{'backupId':bid})
                      elif created: job('fs.delete',{'root':'nexus','path':'bots/nexaccount/'+rel,'allowDir':False})
                  except Exception as e:
                      print('rollback warning',rel,e)
              try:
                  job('runtime.exec',{
                      'root':'nexus',
                      'command':'node',
                      'args':['bots/nexaccount/bootstrap.mjs','--restart'],
                      'timeoutMs':60000
                  },timeout=90)
              except Exception as e:
                  print('rollback restart warning',e)
              raise
          PY
