name: NexAccount CI

on:
  pull_request:
    paths:
      - 'nexaccount/**'
      - 'nexcontrol/api/index.mjs'
      - '.github/workflows/nexaccount-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Tresor562/DIPPER-
          path: _dipper
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node nexaccount/scripts/sync-dipper.mjs _dipper nexaccount
      - run: npm install --prefix nexaccount --ignore-scripts
      - name: Syntax
        run: |
          for f in nexaccount/*.mjs nexaccount/scripts/*.mjs nexcontrol/api/index.mjs; do node --check "$f"; done
      - name: Style and menu smoke test
        run: |
          node --input-type=module - <<'NODE'
          import {loadStyleCatalog} from './nexaccount/styles.mjs';
          import {menuModel,stylesModel} from './nexaccount/menu.mjs';
          import {commandMap} from './nexaccount/commands.mjs';
          const c=await loadStyleCatalog();
          if(c.maxStyle<20)throw new Error('Dipper styles missing');
          const account={telegramUserId:'123',username:'test',firstName:'Test',premium:true};
          const settings={style:1,prefix:'.'};
          const menu=await menuModel({account,settings,commands:commandMap()});
          const styles=await stylesModel({account,settings});
          if(!menu.entities.some(x=>x.type==='expandable_blockquote'))throw new Error('expandable quote missing');
          if(!styles.entities.some(x=>x.type==='bot_command'))throw new Error('style commands missing');
          console.log('styles',c.maxStyle,'menu chars',menu.text.length);
          NODE
