name: NexAccount CI

on:
  push:
    branches: [main]
    paths:
      - 'nexaccount/**'
      - 'nexcontrol/api/index.mjs'
      - '.github/workflows/nexaccount-ci.yml'
  pull_request:
    paths:
      - 'nexaccount/**'
      - 'nexcontrol/api/index.mjs'
      - '.github/workflows/nexaccount-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Tresor562/DIPPER-
          path: _dipper
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node nexaccount/scripts/sync-dipper.mjs _dipper nexaccount
      - run: npm install --prefix nexaccount --ignore-scripts
      - name: Validate command registry
        run: node nexaccount/scripts/validate-registry.mjs
      - name: Audit standalone routing
        run: node nexaccount/scripts/audit-command-routing.mjs
      - name: Group commands regression
        run: node nexaccount/scripts/test-group-commands.mjs
      - name: NexAnime regression
        run: node nexaccount/scripts/test-anime-ingest.mjs
      - name: Media send regression
        run: node nexaccount/scripts/test-media-send.mjs
      - name: WhatsApp sticker package regression
        run: node nexaccount/scripts/test-wastickers.mjs
      - name: TGS decoder regression
        run: node nexaccount/scripts/test-tgs-renderer.mjs
      - name: Menu resilience regression
        run: node nexaccount/scripts/test-menu-resilience.mjs
      - name: Critical public routes regression
        run: node nexaccount/scripts/test-critical-routes.mjs
      - name: Core architecture regression
        run: node nexaccount/scripts/test-core-architecture.mjs
      - name: Syntax
        run: |
          for f in nexaccount/*.mjs nexaccount/core/*.mjs nexaccount/scripts/*.mjs nexcontrol/api/index.mjs; do node --check "$f"; done
      - name: Style and menu smoke test
        run: |
          node --input-type=module - <<'NODE'
          import {loadStyleCatalog} from './nexaccount/styles.mjs';
          import {menuModel,stylesModel} from './nexaccount/menu.mjs';
          import {commandMap} from './nexaccount/commands.mjs';
          const c=await loadStyleCatalog();
          if(c.maxStyle<20)throw new Error('Dipper styles missing');
          if(typeof c.themes?.[1]?.exactHeader!=='function'||typeof c.themes?.[1]?.exactCatCmd!=='function')throw new Error('Exact Dipper style functions missing');
          const account={telegramUserId:'123',username:'test',firstName:'Test',premium:true};
          const settings={style:1,prefix:'.'};
          const menu=await menuModel({account,settings,commands:commandMap()});
          const styles=await stylesModel({account,settings});
          if(!menu.entities.some(x=>x.type==='blockquote'||x.type==='expandable_blockquote'))throw new Error('header quote missing');
          if(!styles.entities.some(x=>x.type==='bot_command'))throw new Error('style commands missing');
          console.log('styles',c.maxStyle,'menu chars',menu.text.length);
          NODE
