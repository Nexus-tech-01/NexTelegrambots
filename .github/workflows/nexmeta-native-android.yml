name: NexMeta Native Android

on:
  push:
    branches:
      - feature/nexmeta-v1
    paths:
      - 'nexmeta/native-android-src.tar.gz.b64'
      - '.github/workflows/nexmeta-native-android.yml'

permissions:
  contents: read

env:
  GRADLE_VERSION: '8.7'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore native Android sources
        run: |
          rm -rf nexmeta/native-android
          mkdir -p nexmeta/native-android
          base64 -d nexmeta/native-android-src.tar.gz.b64 > /tmp/nexmeta-native-src.tar.gz
          tar -xzf /tmp/nexmeta-native-src.tar.gz -C nexmeta/native-android

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Build debug APK
        working-directory: nexmeta/native-android
        run: gradle --no-daemon clean :app:assembleDebug

      - name: Validate APK exists
        run: test -f nexmeta/native-android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NexMeta-Native-Android-1.0.0
          path: nexmeta/native-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
