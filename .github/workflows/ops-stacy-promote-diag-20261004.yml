name: Stacy Promote Diagnostic
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-stacy-promote-diag-20261004.yml'
permissions:
  contents: read
  id-token: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Request GitHub OIDC token and inspect live Stacy
        shell: bash
        env:
          EDGE_URL: https://ojbyvjqurlamplmujmyu.supabase.co/functions/v1/nxc-agent-hotfix-bridge
        run: |
          set -euo pipefail
          OIDC_JSON="$(curl --fail-with-body --silent --show-error -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=nxc-stacy-promote-admin")"
          OIDC="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$OIDC_JSON")"
          BODY="$(python3 -c 'import json,os; print(json.dumps({"mode":"stacy-admin","action":"diagnose","sha":os.environ["GITHUB_SHA"]}))')"
          curl --fail-with-body --silent --show-error -X POST "$EDGE_URL" -H "Authorization: Bearer $OIDC" -H "Content-Type: application/json" --data "$BODY" | tee /tmp/stacy-diag.json
          python3 -c 'import json; d=json.load(open("/tmp/stacy-diag.json")); print(json.dumps(d,ensure_ascii=False,indent=2)); raise SystemExit(0 if d.get("ok") else 1)'
