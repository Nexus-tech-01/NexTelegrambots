name: Deploy NexCanal NexGroup v61.12.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-nexcanal-nexgroup-v61-12-1.yml'
      - '.deploy/v61121-relay.manifest.b64'
      - 'nexcanal/**'
      - 'whatsapp-publisher/**'
      - 'watchers/liteapks-relay.mjs'

permissions:
  contents: read

concurrency:
  group: deploy-nexcanal-nexgroup-v61-12-1
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NXC_BASE: https://nexcontrol-ochre.vercel.app
      NXC_AGENT: nexus-main
      NXC_ADMIN_PASSWORD: ${{ secrets.NEXCONTROL_ADMIN_PASSWORD || secrets.ADMIN_PASSWORD }}
      NXC_SESSION_SECRET: ${{ secrets.NEXCONTROL_SESSION_SECRET || secrets.SESSION_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy NexCanal and NexGroup v61.12.1
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYDEPLOY'
          import os,json,time,base64,gzip,urllib.request,urllib.error,urllib.parse,http.cookiejar,hmac,hashlib,traceback
          from pathlib import Path
          BASE=os.environ['NXC_BASE'].rstrip('/')
          AGENT=os.environ['NXC_AGENT']
          ADMIN=os.environ.get('NXC_ADMIN_PASSWORD','')
          SECRET=os.environ.get('NXC_SESSION_SECRET','')
          manifest=json.loads(gzip.decompress(base64.b64decode(Path('.deploy/v61121-relay.manifest.b64').read_text().strip())))
          jar=http.cookiejar.CookieJar();op=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar));cookie=''
          if SECRET:
              exp=int(time.time()*1000)+20*60*1000
              payload=base64.urlsafe_b64encode(json.dumps({'exp':exp},separators=(',',':')).encode()).decode().rstrip('=')
              sig=base64.urlsafe_b64encode(hmac.new(SECRET.encode(),payload.encode(),hashlib.sha256).digest()).decode().rstrip('=')
              cookie=payload+'.'+sig
          elif ADMIN:
              data=urllib.parse.urlencode({'password':ADMIN}).encode()
              op.open(urllib.request.Request(BASE+'/api/admin/login',data=data,headers={'Content-Type':'application/x-www-form-urlencoded'},method='POST'),timeout=45).read()
          else: raise RuntimeError('No NexControl credential in Actions secrets')
          def http(method,path,data=None):
              h={'Accept':'application/json'}
              if cookie:h['Cookie']='nexcontrol_session='+cookie
              body=None
              if data is not None: body=json.dumps(data,separators=(',',':')).encode();h['Content-Type']='application/json'
              req=urllib.request.Request(BASE+path,data=body,headers=h,method=method)
              try:
                  with op.open(req,timeout=45) as r:
                      raw=r.read().decode('utf-8','replace');return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  raise RuntimeError(f'HTTP {e.code} {path}: '+e.read().decode('utf-8','replace')[:1500])
          def job(kind,payload):
              j=http('POST','/api/admin/agent/jobs',{'agentSlug':AGENT,'kind':kind,'payload':payload});jid=j.get('jobId')
              if not jid: raise RuntimeError(f'No jobId for {kind}: {j}')
              end=time.time()+180
              while time.time()<end:
                  x=http('GET','/api/admin/agent/jobs?id='+urllib.parse.quote(jid));st=x.get('status')
                  if st=='succeeded': return x.get('result') or {}
                  if st=='failed': raise RuntimeError(f'{kind} failed: {x.get("error")}')
                  time.sleep(2)
              raise TimeoutError(f'{kind} timed out: {jid}')
          backups=[]
          try:
              for root in ('nexcanal','nexgroup'):
                  probe=job('fs.list',{'root':root,'path':'.'})
                  print(root,'probe entries',len(probe.get('items',[])),flush=True)
              for root,items in manifest.items():
                  for item in items:
                      content=base64.b64decode(item['b64']).decode('utf-8')
                      r=job('fs.write',{'root':root,'path':item['path'],'content':content})
                      backups.append((root,item['path'],r.get('backupId'),r.get('created',False)))
                  js='dist/src/services/group-relay-channels.js' if root=='nexcanal' else 'dist/domain/group-relay-channels.js'
                  ck=job('check.run',{'check':'node-check','root':root,'file':js,'timeoutMs':60000})
                  if not ck.get('ok'): raise RuntimeError(f'node-check failed {root}: {ck}')
                  verify=job('fs.read',{'root':root,'path':js,'startLine':1,'endLine':100})
                  c=verify.get('content','')
                  for wanted in ('thenexusorigin','tresor_universe','thenexnews'):
                      if wanted not in c: raise RuntimeError(f'{root}: missing {wanted}')
                  if "BLOCKED_RELAY_CHANNELS" not in c or 'inconnuboysensei' not in c:
                      raise RuntimeError(f'{root}: explicit block guard missing')

              # Visual lifestyle feed: media-first posts to @tresor_universe.
              social_src=Path('nexcanal/social-feed.mjs')
              if not social_src.exists():
                  raise RuntimeError('missing nexcanal/social-feed.mjs')
              social_text=social_src.read_text(encoding='utf-8')
              for required in ('createSocialFeed','Pinterest','sendPhoto','tresor_universe','WHATSAPP_BRIDGE'):
                  if required not in social_text:
                      raise RuntimeError('social feed missing '+required)
              sr=job('fs.write',{'root':'nexcanal','path':'social-feed.mjs','content':social_text})
              backups.append(('nexcanal','social-feed.mjs',sr.get('backupId'),sr.get('created',False)))
              ck=job('check.run',{'check':'node-check','root':'nexcanal','file':'social-feed.mjs','timeoutMs':60000})
              if not ck.get('ok'):
                  raise RuntimeError('node-check failed nexcanal/social-feed.mjs: '+str(ck))

              # WhatsApp publisher: accept @tresor_universe and route those
              # lifestyle posts to the Otaku Nexus newsletter (channel only).
              wa_src=Path('whatsapp-publisher/server.mjs')
              wa_text=wa_src.read_text(encoding='utf-8')
              for required in ("'tresor_universe'","publication Otaku/Dark Universe -> chaîne Otaku Nexus",'Nex WhatsApp Publisher bridge ready'):
                  if required not in wa_text:
                      raise RuntimeError('WhatsApp publisher missing '+required)

              wa_search=job('fs.search',{
                  'root':'nexus','path':'.',
                  'query':'Nex WhatsApp Publisher bridge ready',
                  'maxResults':40
              })
              wa_matches=[m for m in wa_search.get('matches',[]) if str(m.get('path','')).endswith('server.mjs') and 'whatsapp' in str(m.get('path','')).lower()]
              if not wa_matches:
                  # Print running processes so a missing deployment root is diagnosable
                  # from the Actions log rather than silently skipping WhatsApp.
                  procs=job('process.list',{'limit':500})
                  candidates=[p for p in procs.get('items',[]) if 'whatsapp' in str(p.get('cmdline','')).lower()]
                  print('WHATSAPP_PROCESS_CANDIDATES',json.dumps(candidates[-20:],ensure_ascii=False),flush=True)
                  raise RuntimeError('live WhatsApp publisher path not found inside NexControl nexus root')
              wa_path=str(wa_matches[0]['path'])
              print('WHATSAPP_PUBLISHER_PATH',wa_path,flush=True)
              wr_wa=job('fs.write',{'root':'nexus','path':wa_path,'content':wa_text})
              backups.append(('nexus',wa_path,wr_wa.get('backupId'),wr_wa.get('created',False)))
              ck=job('check.run',{'check':'node-check','root':'nexus','file':wa_path,'timeoutMs':60000})
              if not ck.get('ok'):
                  raise RuntimeError('node-check failed WhatsApp publisher: '+str(ck))

              # Restart the registered WhatsApp service when available.
              # If it is supervised outside the registry, SIGTERM the exact
              # publisher process; its supervisor/systemd owner must respawn it.
              services=job('service.list',{'includeHealth':False})
              wa_services=[s for s in services.get('items',[]) if 'whatsapp' in (str(s.get('name',''))+' '+str(s.get('unit',''))+' '+str(s.get('description',''))).lower()]
              if wa_services:
                  chosen=wa_services[0]
                  rr=job('service.action',{'name':chosen['name'],'action':'restart'})
                  if not rr.get('ok'):
                      raise RuntimeError('WhatsApp service restart failed: '+str(rr))
                  print('WHATSAPP_SERVICE_RESTARTED',chosen['name'],flush=True)
              else:
                  procs=job('process.list',{'limit':500})
                  candidates=[p for p in procs.get('items',[]) if wa_path in str(p.get('cmdline','')) or ('whatsapp-publisher' in str(p.get('cmdline','')).lower() and 'server.mjs' in str(p.get('cmdline','')))]
                  if not candidates:
                      raise RuntimeError('WhatsApp publisher process not found for restart')
                  target=sorted(candidates,key=lambda x:int(x.get('pid',0)))[-1]
                  job('runtime.signal',{'pid':int(target['pid']),'signal':'SIGTERM'})
                  print('WHATSAPP_PROCESS_SIGTERM',target['pid'],flush=True)
                  time.sleep(5)

              wh=job('http.check',{'url':'http://127.0.0.1:18787/healthz','timeoutMs':10000,'previewBytes':500})
              if not wh.get('ok'):
                  raise RuntimeError('WhatsApp bridge health failed after restart: '+str(wh))
              print('WHATSAPP_BRIDGE_OK',wh.get('status'),flush=True)

              # Direct Telegram channel_post -> WhatsApp bridge.
              # Avoid a second MTProto reader/session: NexCanal already receives
              # channel_post updates through the Bot API.
              hook_src=Path('nexcanal/nextech-whatsapp-channel-post.mjs')
              if not hook_src.exists():
                  raise RuntimeError('missing nexcanal/nextech-whatsapp-channel-post.mjs')
              hook_text=hook_src.read_text(encoding='utf-8')
              for required in ('thenexusorigin','thenexnews','tresor_universe','mirrorNextechChannelPostToWhatsApp'):
                  if required not in hook_text:
                      raise RuntimeError('WhatsApp channel_post helper missing '+required)
              wr_hook=job('fs.write',{'root':'nexcanal','path':'dist/src/telegram/nextech-whatsapp-channel-post.js','content':hook_text})
              backups.append(('nexcanal','dist/src/telegram/nextech-whatsapp-channel-post.js',wr_hook.get('backupId'),wr_hook.get('created',False)))
              ck=job('check.run',{'check':'node-check','root':'nexcanal','file':'dist/src/telegram/nextech-whatsapp-channel-post.js','timeoutMs':60000})
              if not ck.get('ok'):
                  raise RuntimeError('node-check failed channel_post helper: '+str(ck))

              main=job('fs.read',{'root':'nexcanal','path':'dist/src/main.js','startLine':1,'endLine':900}).get('content','')
              import_line="import { mirrorNextechChannelPostToWhatsApp } from './telegram/nextech-whatsapp-channel-post.js';"
              import_anchor="import { TelegramBotApi, TelegramApiError } from './telegram/api.js';"
              hook_line="    if (update?.channel_post) await mirrorNextechChannelPostToWhatsApp(api, update).catch((error) => console.warn('[Telegram/WhatsApp] channel_post mirror failed', error instanceof Error ? error.message : String(error)));"
              processor_anchor="    const update = u;"
              if import_line not in main:
                  if import_anchor not in main: raise RuntimeError('NexCanal main import anchor missing')
                  main=main.replace(import_anchor,import_anchor+'\\n'+import_line,1)
              if hook_line not in main:
                  if processor_anchor not in main: raise RuntimeError('NexCanal processor anchor missing')
                  main=main.replace(processor_anchor,processor_anchor+'\\n'+hook_line,1)
              wr_main=job('fs.write',{'root':'nexcanal','path':'dist/src/main.js','content':main})
              backups.append(('nexcanal','dist/src/main.js',wr_main.get('backupId'),wr_main.get('created',False)))
              ck=job('check.run',{'check':'node-check','root':'nexcanal','file':'dist/src/main.js','timeoutMs':60000})
              if not ck.get('ok'):
                  raise RuntimeError('node-check failed NexCanal main WhatsApp hook: '+str(ck))

              # Canonical APK watcher. @tresor20009 only scans; NexCanal bot publishes.
              watcher_src=Path('nexcanal/liteapks-relay.mjs')
              if not watcher_src.exists():
                  raise RuntimeError('missing canonical nexcanal/liteapks-relay.mjs')
              watcher_text=watcher_src.read_text(encoding='utf-8')
              for required in ('tresor20009','NEXCANAL__BOT_TOKEN','publisher.start','thenexusorigin','createSocialFeed','socialFeed.tick'):
                  if required not in watcher_text:
                      raise RuntimeError('NexCanal watcher missing '+required)
              wr=job('fs.write',{'root':'nexcanal','path':'liteapks-relay.mjs','content':watcher_text})
              backups.append(('nexcanal','liteapks-relay.mjs',wr.get('backupId'),wr.get('created',False)))
              ck=job('check.run',{'check':'node-check','root':'nexcanal','file':'liteapks-relay.mjs','timeoutMs':60000})
              if not ck.get('ok'):
                  raise RuntimeError('node-check failed nexcanal/liteapks-relay.mjs: '+str(ck))
              job('runtime.restart',{'target':'nexcanal','reason':'Deploy frequent visual Luxury/Otaku social feed + WhatsApp Otaku Nexus mirror'})
              job('runtime.restart',{'target':'nexgroup','reason':'Deploy v61.12.1 NexNews + tresor_universe relay mapping'})
              time.sleep(12)
              try:
                  logs=job('logs.tail',{'log':'launcher','bytes':160000})
                  log_text=logs.get('content','')
                  print(log_text[-12000:],flush=True)
                  required_runtime_signals=(
                      'scanner connected as @tresor20009',
                      'public publisher connected as @'
                  )
                  missing=[x for x in required_runtime_signals if x not in log_text]
                  if missing:
                      raise RuntimeError('NexCanal watcher runtime verification failed; missing: '+', '.join(missing))
              except Exception as e:
                  raise RuntimeError('post-restart NexCanal verification failed: '+str(e))
              print('DEPLOYMENT_OK NexSocial visual feed + Telegram + WhatsApp Otaku Nexus mirror',flush=True)
          except Exception:
              traceback.print_exc()
              for root,path,bid,created in reversed(backups):
                  try:
                      if bid: job('fs.rollback',{'backupId':bid})
                      elif created: job('fs.delete',{'root':root,'path':path,'allowDir':False})
                  except Exception as e: print('rollback warning',root,path,e,flush=True)
              raise
          PYDEPLOY
