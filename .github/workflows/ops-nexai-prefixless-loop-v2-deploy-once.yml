name: Ops NexAI Prefixless Loop V2 Deploy Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-nexai-prefixless-loop-v2-deploy-once.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: ops-nexai-prefixless-loop-v2-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate anti-loop source
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix nexaccount --ignore-scripts
          node --check nexaccount/config.mjs
          node --check nexaccount/runtime.mjs
          node --check nexaccount/compat.mjs
          grep -F "function messageLooksGeneratedByNexAi(message)" nexaccount/runtime.mjs
          grep -F ".replace(/\\s+by nextech\\s*$/i,'')" nexaccount/runtime.mjs
          grep -F "if(selfAuthored&&messageLooksGeneratedByNexAi(message))return false;" nexaccount/runtime.mjs
          grep -F "✅ Mode PUBLIC activé" nexaccount/compat.mjs
          grep -F "consumeGeneratedCommandOutput" nexaccount/runtime.mjs
          grep -F "markGeneratedCommandOutput" nexaccount/runtime.mjs
          grep -F "const PREFIXLESS_USERNAMES=new Set([" nexaccount/runtime.mjs
          grep -F "'tresor20000'" nexaccount/runtime.mjs
          grep -F "'tresor20009'" nexaccount/runtime.mjs
          grep -F "'tresor20001'" nexaccount/runtime.mjs
          grep -F "'tresor_htn'" nexaccount/runtime.mjs
          grep -F "const DEFAULT_ADMIN_USERNAMES='josh_33_06';" nexaccount/config.mjs
          grep -F "...cfg.adminUsernames" nexaccount/runtime.mjs
          grep -F "isAdminIdentity(account.telegramUserId,account.username)" nexaccount/runtime.mjs
          grep -F "const callerHasNexAiPremium=event?.callerOwner===true||account.nexaiPremium===true;" nexaccount/runtime.mjs
          node nexaccount/scripts/test-premium-access.mjs
          node nexaccount/scripts/test-group-commands.mjs
          grep -F "const requested=Math.max(1,Math.floor(Number(args[0])||20));" nexaccount/compat.mjs
          if grep -F "Math.min(100,Number(args[0])" nexaccount/compat.mjs; then
            echo "Purge is still hard-capped at 100" >&2
            exit 1
          fi
          grep -F "allowBare:allowBare===true" nexaccount/runtime.mjs
          if grep -F "allowBare:true" nexaccount/runtime.mjs; then
            echo "Unsafe global prefixless mode still present" >&2
            exit 1
          fi

      - name: Deploy anti-loop hotfix to NexAI VPS
        shell: bash
        env:
          DEPLOY_ENDPOINT: https://ojbyvjqurlamplmujmyu.supabase.co/functions/v1/nxc-agent-hotfix-bridge
        run: |
          set -euo pipefail
          OIDC_JSON="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=nxc-nexai-custom-style-deploy")"
          OIDC_TOKEN="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$OIDC_JSON")"
          test -n "$OIDC_TOKEN"

          curl --fail-with-body --silent --show-error --max-time 420 \
            -X POST "$DEPLOY_ENDPOINT" \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            --data "{\"sha\":\"${GITHUB_SHA}\",\"mode\":\"prefixless-loop\"}" \
            | tee /tmp/nexai-prefixless-loop-deploy.json

          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/nexai-prefixless-loop-deploy.json').read_text())
          if d.get('ok') is not True:
              raise SystemExit('deployment failed: '+str(d))
          steps=d.get('steps') or {}
          if steps.get('sourceValidated') is not True:
              raise SystemExit('source validation not confirmed: '+str(steps))
          if steps.get('productionMarker') is not True:
              raise SystemExit('production marker not confirmed: '+str(steps))
          purge=steps.get('live',{}).get('purge') or steps.get('purge') or {}
          if purge.get('ready') is not True or purge.get('hardCap100') is not False:
              raise SystemExit('purge production verification missing: '+str(steps))
          health=steps.get('health') or {}
          if health.get('ok') is not True or health.get('pairingOnly') is True:
              raise SystemExit('NexAI health not confirmed: '+str(health))
          live=steps.get('live') or {}
          anti=live.get('prefixlessLoop') or {}
          if anti.get('antiLoop') is not True or anti.get('broadcastReplySafe') is not True:
              raise SystemExit('anti-loop production verification missing: '+str(live))
          admin=live.get('adminAccess') or {}
          if admin.get('josh') is not True or admin.get('prefixless') is not True or admin.get('nexaiPremium') is not True:
              raise SystemExit('Josh admin production verification missing: '+str(live))
          anime=live.get('anime') or {}
          if anime.get('ok') is not True or anime.get('enabled') is not True:
              raise SystemExit('NexAnime regression check failed: '+str(anime))
          accounts=live.get('accounts') or {}
          if accounts.get('tresor20001') is not True or accounts.get('tresor20009') is not True:
              raise SystemExit('critical NexAI sessions not confirmed: '+str(accounts))
          print('NEXAI_PREFIXLESS_LOOP_V2_PRODUCTION_OK')
          PY

# trigger: purge-live-fix-20261004-v3
