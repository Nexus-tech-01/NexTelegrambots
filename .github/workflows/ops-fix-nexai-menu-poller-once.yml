name: Ops Fix NexAI Menu Poller Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-fix-nexai-menu-poller-once.yml'

permissions:
  contents: read

concurrency:
  group: ops-fix-nexai-menu-poller-once
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate inline menu recovery patch
        run: |
          npm install --prefix nexaccount --ignore-scripts
          node --check nexaccount/inline-bot.mjs
          node nexaccount/scripts/test-menu-resilience.mjs

      - name: Deploy and verify through one-shot NexControl bridge
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl --fail-with-body --silent --show-error --max-time 300 'https://ojbyvjqurlamplmujmyu.supabase.co/functions/v1/nxc-ptero-import-once')"
          echo "$body"
          python3 - "$body" <<'PY'
          import json,sys
          d=json.loads(sys.argv[1])
          if d.get("ok") is not True:
              raise SystemExit("deployment failed: "+str(d))
          if d.get("commit")!="747108285799b5b9823ae0e9d20911009a10eeb2":
              raise SystemExit("unexpected deployed commit: "+str(d.get("commit")))
          if d.get("deploymentOk") is not True:
              raise SystemExit("deployment was not verified: "+str(d))
          if d.get("automationsOk") is not True:
              raise SystemExit("critical automations failed verification: "+str(d))
          probe=d.get("menuProbe") or {}
          if d.get("alreadyDone") is not True and (probe.get("ok") is not True or not probe.get("resultId")):
              raise SystemExit("inline menu probe failed: "+str(d))
          print("NEXAI_MENU_FIX_OK",d)
          PY
