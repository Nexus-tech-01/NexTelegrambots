name: Ops Anime Session State 2026-10-03

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-anime-session-state-20261003.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NXC_BASE: https://nexcontrol-ochre.vercel.app
      NXC_AGENT: nexus-main
      NXC_ADMIN_PASSWORD: ${{ secrets.NEXCONTROL_ADMIN_PASSWORD || secrets.ADMIN_PASSWORD }}
      NXC_SESSION_SECRET: ${{ secrets.NEXCONTROL_SESSION_SECRET || secrets.SESSION_SECRET }}
    steps:
      - name: Inspect saved NexAccount records on production
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,time,urllib.request,urllib.error,urllib.parse,http.cookiejar,hmac,hashlib,base64
          BASE=os.environ['NXC_BASE'].rstrip('/')
          AGENT=os.environ['NXC_AGENT']
          ADMIN=os.environ.get('NXC_ADMIN_PASSWORD','')
          SECRET=os.environ.get('NXC_SESSION_SECRET','')
          jar=http.cookiejar.CookieJar()
          op=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          cookie=''
          if SECRET:
              exp=int(time.time()*1000)+10*60*1000
              payload=base64.urlsafe_b64encode(json.dumps({'exp':exp},separators=(',',':')).encode()).decode().rstrip('=')
              sig=base64.urlsafe_b64encode(hmac.new(SECRET.encode(),payload.encode(),hashlib.sha256).digest()).decode().rstrip('=')
              cookie=payload+'.'+sig
          elif ADMIN:
              data=urllib.parse.urlencode({'password':ADMIN}).encode()
              op.open(urllib.request.Request(BASE+'/api/admin/login',data=data,headers={'Content-Type':'application/x-www-form-urlencoded'},method='POST'),timeout=45).read()
          else:
              raise RuntimeError('No NexControl credential')

          def http(method,path,data=None,timeout=60):
              headers={'Accept':'application/json'}
              if cookie: headers['Cookie']='nexcontrol_session='+cookie
              body=None
              if data is not None:
                  body=json.dumps(data,separators=(',',':')).encode()
                  headers['Content-Type']='application/json'
              req=urllib.request.Request(BASE+path,data=body,headers=headers,method=method)
              with op.open(req,timeout=timeout) as r:
                  raw=r.read().decode('utf-8','replace')
                  return json.loads(raw) if raw else {}

          def job(kind,payload,timeout=120):
              j=http('POST','/api/admin/agent/jobs',{'agentSlug':AGENT,'kind':kind,'payload':payload})
              jid=j.get('jobId')
              if not jid: raise RuntimeError('No jobId: '+str(j))
              end=time.time()+timeout
              while time.time()<end:
                  x=http('GET','/api/admin/agent/jobs?id='+urllib.parse.quote(jid),timeout=45)
                  if x.get('status')=='succeeded': return x.get('result') or {}
                  if x.get('status')=='failed': raise RuntimeError(str(x.get('error')))
                  time.sleep(1)
              raise TimeoutError(jid)

          script = r"""
          import { listAccounts } from './bots/nexaccount/store.mjs';
          const rows = await listAccounts();
          const safe = rows.map(x => ({
            username:String(x.username||''),
            enabled:x.enabled===true,
            sessionRepairRequired:x.sessionRepairRequired===true,
            sessionRepairReason:String(x.sessionRepairReason||''),
            runtimeBucket:x.runtimeBucket,
            connectedAt:x.connectedAt||null,
            updatedAt:x.updatedAt||null
          }));
          console.log(JSON.stringify({count:safe.length,accounts:safe}));
          """
          out=job('runtime.exec',{
              'root':'nexus',
              'command':'node',
              'args':['--input-type=module','-e',script],
              'timeoutMs':60000
          },timeout=90)
          print((out.get('stdout') or '').strip())
          if out.get('ok') is False:
              raise RuntimeError(str(out)[-3000:])
          PY
