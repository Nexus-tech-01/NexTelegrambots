name: Ops Anime Diagnostic Once
# recovery pass: free safe cache, start VPS, verify NexAnime/NexCanal 2026-09-28T06:33+01:00

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-anime-diagnostic-once.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Disk layout before cleanup
        run: |
          for d in / /.npm /node_modules /tmp /.cache /bots /data; do
            echo "=== BEFORE $d ==="
            curl --fail-with-body --silent --show-error "https://ojbyvjqurlamplmujmyu.supabase.co/functions/v1/nxc-ptero-startfiles-read?dir=$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1],safe=""))' "$d")"
            echo
          done
      - name: Safe cache cleanup
        run: |
          echo '=== SAFE CLEANUP ==='
          curl --fail-with-body --silent --show-error "https://ojbyvjqurlamplmujmyu.supabase.co/functions/v1/nxc-safe-cache-clean-once"
          echo
      - name: Start VPS
        run: |
          echo '=== START ==='
          curl --fail-with-body --silent --show-error "https://ojbyvjqurlamplmujmyu.supabase.co/functions/v1/nxc-ptero-restart-once"
          echo
      - name: Wait for boot
        run: sleep 20
      - name: Runtime after cleanup
        run: |
          echo '=== RUNTIME ==='
          curl --fail-with-body --silent --show-error "https://ojbyvjqurlamplmujmyu.supabase.co/functions/v1/nxc-ptero-read-nexmeta-runtime-once"
          echo
      - name: Console after cleanup
        run: |
          echo '=== CONSOLE ==='
          curl --fail-with-body --silent --show-error "https://ojbyvjqurlamplmujmyu.supabase.co/functions/v1/nxc-ptero-console-live"
          echo
