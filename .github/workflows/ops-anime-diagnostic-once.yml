name: Ops Anime Diagnostic Once
# recovery pass: deploy current anime runtime + verify NexCanal 2026-09-28T06:39+01:00

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-anime-diagnostic-once.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Deploy current NexAnime runtime files
        run: |
          echo '=== DEPLOY ANIME ==='
          curl --fail-with-body --silent --show-error "https://ojbyvjqurlamplmujmyu.supabase.co/functions/v1/nxc-ptero-import-once"
          echo
      - name: Wait for boot
        run: sleep 25
      - name: Runtime after anime deploy
        run: |
          echo '=== RUNTIME ==='
          curl --fail-with-body --silent --show-error "https://ojbyvjqurlamplmujmyu.supabase.co/functions/v1/nxc-ptero-read-nexmeta-runtime-once"
          echo
      - name: Console after anime deploy
        run: |
          echo '=== CONSOLE ==='
          curl --fail-with-body --silent --show-error "https://ojbyvjqurlamplmujmyu.supabase.co/functions/v1/nxc-ptero-console-live"
          echo
