name: Ops NexAnime Search Bot Deploy Once

on:
  push:
    branches: [main]
    paths:
      - 'nexaccount/nexanime-bot.mjs'
      - 'nexaccount/nexanime-worker.mjs'
      - 'nexaccount/nexanime-secrets.mjs'
      - 'nexaccount/daemon.mjs'
      - 'ops/deploy-nexai-safe-hotfix-live.mjs'
      - '.github/workflows/ops-nexanime-search-bot-deploy-once.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: ops-nexanime-search-bot-deploy-once
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate NexAnime bot sources
        shell: bash
        run: |
          set -euo pipefail
          node --check nexaccount/nexanime-secrets.mjs
          node --check nexaccount/nexanime-bot.mjs
          node --check nexaccount/nexanime-worker.mjs
          node --check nexaccount/daemon.mjs
          node --check ops/deploy-nexai-safe-hotfix-live.mjs
          grep -F "api.franime.fr" nexaccount/nexanime-bot.mjs
          grep -F "uploadForFileId" nexaccount/nexanime-bot.mjs
          grep -F "nexanime_bot_jobs" nexaccount/nexanime-worker.mjs
          grep -F "startNexAnimeBot" nexaccount/daemon.mjs

      - name: Deploy through NexControl safe bridge
        shell: bash
        env:
          DEPLOY_ENDPOINT: https://ojbyvjqurlamplmujmyu.supabase.co/functions/v1/nxc-agent-hotfix-bridge
        run: |
          set -euo pipefail
          OIDC_JSON="$(curl --fail-with-body --silent --show-error             -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=nxc-nexanime-safe-deploy")"
          OIDC_TOKEN="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$OIDC_JSON")"
          body="$(curl --fail-with-body --silent --show-error --max-time 330             -X POST "$DEPLOY_ENDPOINT"             -H "Authorization: Bearer $OIDC_TOKEN"             -H "Content-Type: application/json"             --data "{\"sha\":\"${GITHUB_SHA}\",\"mode\":\"nexanime-search-bot\"}")"
          echo "$body"
          python3 - "$body" <<'PY'
          import json,sys
          d=json.loads(sys.argv[1])
          if d.get("ok") is not True:
              raise SystemExit("NexAnime safe deploy failed: "+str(d))
          if (d.get("steps") or {}).get("safeSingleRuntime") is not True:
              raise SystemExit("single-runtime protection missing")
          print("NEXANIME_SEARCH_BOT_DEPLOY_OK")
          PY
