# retry native+batch deploy after runner dependency fix 2026-10-04
# deploy native+batch sticker acceleration 2026-10-04
# deploy accelerated sticker pipeline 2026-10-04
# deploy engine-router with take fix 2026-10-04
# deploy verified take completion fix 2026-10-04
# deploy take bare-alias fix 2026-10-04
# trigger final durable sticker deployment 2026-10-04
# deploy durable full-pack sticker queue 2026-10-04
# deploy watermark controls 2026-10-03
# deploy runtime sticker fallback 2026-10-03
# sync ultratake+delfilig production v2
# sync ultratake+delfilig 2026-10-03
name: Ops NexAI Sticker Transforms Deploy Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-nexai-sticker-transforms-deploy-once.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: ops-nexai-sticker-transforms-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Validate exact source
        shell: bash
        run: |
          set -euo pipefail
          node --check nexaccount/commands.mjs
          node --check nexaccount/sticker-engine.mjs
          node --check nexaccount/sticker-transform.mjs
          node --check nexaccount/core/engine-router.mjs
          node --check nexaccount/runtime.mjs
          grep -F "C('ultratake'" nexaccount/commands.mjs
          grep -F "C('delfilig'" nexaccount/commands.mjs
          grep -F "C('filitake'" nexaccount/commands.mjs
          grep -F "C('noteclone'" nexaccount/commands.mjs
          grep -F "take:'clonepack'" nexaccount/commands.mjs
          grep -F "'clonepack','take'" nexaccount/sticker-engine.mjs
          grep -F "if(name==='clonepack'||name==='take')" nexaccount/sticker-engine.mjs
          grep -F "verifyDestinationPart" nexaccount/sticker-engine.mjs
          grep -F "verifiedTotal" nexaccount/sticker-engine.mjs
          grep -F "démarrage confirmé" nexaccount/sticker-engine.mjs
          grep -F "Sticker engine fallback" nexaccount/runtime.mjs
          grep -F "nexaccount_sticker_jobs" nexaccount/sticker-engine.mjs
          grep -F "export async function resumeStickerJobs" nexaccount/sticker-engine.mjs
          grep -F "STICKER_PACK_PART_SIZE" nexaccount/sticker-engine.mjs
          grep -F "sourceDocumentIds" nexaccount/sticker-engine.mjs
          grep -F "resumeStickerJobs(runtime)" nexaccount/runtime.mjs
          grep -F "outcome?.deferred!==true" nexaccount/core/engine-router.mjs
          grep -F "applyDurableStickerMutation" nexaccount/sticker-engine.mjs
          grep -F "startPrepared" nexaccount/sticker-engine.mjs
          grep -F "traitement rapide sécurisé" nexaccount/sticker-engine.mjs
          grep -F "NEXAI_STICKER_MUTATION_GAP_MS||300" nexaccount/sticker-engine.mjs
          grep -F "runNativeCloneJob" nexaccount/sticker-engine.mjs
          grep -F "new Api.stickers.CreateStickerSet" nexaccount/sticker-engine.mjs
          grep -F "createSetBatch" nexaccount/sticker-engine.mjs
          grep -F "préparation batch" nexaccount/sticker-engine.mjs
          grep -F "NEXAI_STICKER_DOWNLOAD_CONCURRENCY||3" nexaccount/sticker-engine.mjs
          if grep -F "MAX_CLONE" nexaccount/sticker-engine.mjs; then
            echo "legacy pack truncation still present" >&2
            exit 1
          fi

      - name: Deploy only sticker transform files to NexAI VPS
        shell: bash
        env:
          DEPLOY_ENDPOINT: https://ojbyvjqurlamplmujmyu.supabase.co/functions/v1/nxc-agent-hotfix-bridge
        run: |
          set -euo pipefail
          OIDC_JSON="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=nxc-nexai-sticker-transforms-deploy")"
          OIDC_TOKEN="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$OIDC_JSON")"
          test -n "$OIDC_TOKEN"

          curl --fail-with-body --silent --show-error \
            -X POST "$DEPLOY_ENDPOINT" \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            --data "{\"sha\":\"${GITHUB_SHA}\"}" \
            | tee /tmp/nexai-sticker-deploy.json

          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/nexai-sticker-deploy.json').read_text())
          if d.get('ok') is not True:
              raise SystemExit('deployment failed: '+str(d))
          steps=d.get('steps') or {}
          if steps.get('sourceValidated') is not True:
              raise SystemExit('source validation not confirmed')
          if steps.get('productionMarker') is not True:
              raise SystemExit('production marker not confirmed: '+str(steps))
          live=steps.get('live') or {}
          if live.get('sourceValidated') is not True or live.get('syntax') is not True:
              raise SystemExit('live sticker source/syntax not confirmed: '+str(live))
          written=set(live.get('written') or [])
          required={'commands.mjs','sticker-engine.mjs','sticker-transform.mjs','runtime.mjs','core/engine-router.mjs'}
          if not required.issubset(written):
              raise SystemExit('production sticker files incomplete: '+str(sorted(written)))
          health=(live.get('health') or {}).get('data') or steps.get('health') or {}
          if health.get('ok') is not True or health.get('pairingOnly') is True:
              raise SystemExit('NexAI health not confirmed: '+str(health))
          print('NEXAI_STICKER_DURABLE_PRODUCTION_OK')
          PY
