name: NexGroup Current Config Read

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-nexgroup-current-config-read.yml'

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Read current live config callbacks
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error             "https://ojbyvjqurlamplmujmyu.supabase.co/functions/v1/nxc-diag-live" |
          python3 -c 'import sys,json; print(json.dumps(json.load(sys.stdin),ensure_ascii=False,indent=2))'

