name: NexStick source inspect

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ops-nexstick-source-inspect.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect live VPS bot tree
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error             "https://ojbyvjqurlamplmujmyu.supabase.co/functions/v1/nxc-ptero-browser-files-probe?root=%2Fbots"             -o /tmp/bots.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/bots.json'))
          print('ok=',d.get('ok'),'root=',d.get('root'),'files=',d.get('files'),'truncated=',d.get('truncated'))
          for x in d.get('fileList') or []:
              p=str(x.get('path',''))
              if 'nexstick' in p.lower() or 'sticker' in p.lower():
                  print(json.dumps(x,ensure_ascii=False))
          PY
