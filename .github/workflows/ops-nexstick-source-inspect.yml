name: NexStick source inspect

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ops-nexstick-source-inspect.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Map allowed Pterodactyl runtime paths
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://ojbyvjqurlamplmujmyu.supabase.co/functions/v1/nxc-ptero-browser-files-probe"
          for root in bots services config scripts ecosystem pterodactyl; do
            curl --fail-with-body --silent --show-error "$BASE?root=%2F$root" -o "/tmp/$root.json"
          done
          python3 - <<'PY'
          import json,re
          pat=re.compile(r'nexstick|stick|telegram|bot|launch|start|service|ecosystem|pm2|supervisor|package|docker|main|index',re.I)
          for root in ['bots','services','config','scripts','ecosystem','pterodactyl']:
              d=json.load(open('/tmp/'+root+'.json'))
              print('\n=== /'+root+' === ok=',d.get('ok'),'files=',d.get('files'),'visited=',d.get('visited'),'truncated=',d.get('truncated'))
              rows=[]
              for x in d.get('fileList') or []:
                  p=str(x.get('path') or '')
                  if pat.search(p):
                      rows.append((p,x.get('size')))
              for p,s in rows[:1200]:
                  print(p,'size='+str(s))
          PY

