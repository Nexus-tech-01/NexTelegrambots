name: NexStick source inspect

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ops-nexstick-source-inspect.yml"

permissions:
  contents: read
  id-token: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Read live NexStick source securely
        shell: bash
        env:
          ENDPOINT: https://ojbyvjqurlamplmujmyu.supabase.co/functions/v1/nxc-ptero-browser-files-probe?mode=nexstick-source
        run: |
          set -euo pipefail
          OIDC_JSON="$(curl --fail-with-body --silent --show-error             -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=nxc-nexstick-source-read")"
          OIDC_TOKEN="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$OIDC_JSON")"
          curl --fail-with-body --silent --show-error             -H "Authorization: Bearer $OIDC_TOKEN"             "$ENDPOINT" -o /tmp/nexstick-source.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/nexstick-source.json'))
          if d.get('ok') is not True:
              raise SystemExit(str(d))
          print('OK',d.get('ok'),'ROOT',d.get('root'),'FILES',d.get('files'),'VISITED',d.get('visited'))
          for x in d.get('fileList') or []:
              print('\n=== '+str(x.get('path'))+' ===')
              if x.get('content') is not None:
                  print(x['content'])
              else:
                  print('<binary or too large: '+str(x.get('size'))+' bytes>')
          PY

# nexstick-secure-source-read-20261003
