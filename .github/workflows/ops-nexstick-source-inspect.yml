name: NexStick source inspect

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ops-nexstick-source-inspect.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Locate live NexStick runtime
        shell: bash
        run: |
          set -euo pipefail
          for root in services ecosystem data pterodactyl nexus-bridge; do
            echo "=== /$root ==="
            curl --fail-with-body --silent --show-error               "https://ojbyvjqurlamplmujmyu.supabase.co/functions/v1/nxc-ptero-browser-files-probe?root=%2F$root"               -o "/tmp/$root.json"
            python3 - "$root" <<'PY'
          import json,sys
          root=sys.argv[1]
          d=json.load(open('/tmp/'+root+'.json'))
          print('ok=',d.get('ok'),'files=',d.get('files'),'truncated=',d.get('truncated'))
          for x in d.get('fileList') or []:
              p=str(x.get('path',''))
              content=str(x.get('content') or '')
              if any(k in (p+' '+content).lower() for k in ['nexstick','the_nexus_techbot','sticker-engine','sticker']):
                  y={k:v for k,v in x.items() if k!='content'}
                  print(json.dumps(y,ensure_ascii=False))
          PY
          done
