name: NexStick source inspect

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ops-nexstick-source-inspect.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read NexStick canonical source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/nexus
          cat $(printf '%s\n' nexus-bots-src.tar.xz.b64.part-* | sort) | base64 -d > /tmp/nexus-bots.tar.xz
          xz -t /tmp/nexus-bots.tar.xz
          tar -xJf /tmp/nexus-bots.tar.xz -C /tmp/nexus ./bots/nexstick
          find /tmp/nexus/bots/nexstick -maxdepth 5 -type f -print | sort
          echo "=== stickerService.js ==="
          cat /tmp/nexus/bots/nexstick/src/services/stickerService.js
