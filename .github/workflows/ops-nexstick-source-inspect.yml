name: NexStick source inspect

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ops-nexstick-source-inspect.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read bundled NexStick service
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/nexus
          python3 - <<'PY'
import base64,glob
with open('/tmp/nexus.tar.xz','wb') as out:
    for name in sorted(glob.glob('render-src.b64.part-*')):
        s=''.join(open(name,encoding='utf-8').read().split())
        s += '='*((4-len(s)%4)%4)
        out.write(base64.b64decode(s,validate=False))
PY
          xz -t /tmp/nexus.tar.xz
          tar -xJf /tmp/nexus.tar.xz -C /tmp/nexus ./bots/nexstick
          echo "=== FILES ==="
          find /tmp/nexus/bots/nexstick -maxdepth 5 -type f -print | sort
          echo "=== stickerService.js ==="
          cat /tmp/nexus/bots/nexstick/src/services/stickerService.js
