name: NexStick source inspect

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ops-nexstick-source-inspect.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Locate live NexStick
        shell: bash
        run: |
          set -euo pipefail
          for root in bots services ecosystem nexus-bridge; do
            url="https://ojbyvjqurlamplmujmyu.supabase.co/functions/v1/nxc-ptero-browser-files-probe?root=%2F$root"
            curl --fail-with-body --silent --show-error "$url" -o "/tmp/$root.json"
          done
          python3 - <<'PY'
          import json
          for root in ('bots','services','ecosystem','nexus-bridge'):
              d=json.load(open('/tmp/'+root+'.json'))
              print('\n###',root,'ok=',d.get('ok'),'files=',d.get('files'))
              for x in d.get('fileList') or []:
                  p=str(x.get('path') or '')
                  if 'nexstick' in p.lower() or 'sticker' in p.lower():
                      print(p, x.get('size'))
          PY
