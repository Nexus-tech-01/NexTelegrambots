name: NexStick source inspect

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ops-nexstick-source-inspect.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect NexControl backup format
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error             "https://ojbyvjqurlamplmujmyu.supabase.co/functions/v1/nxc-ptero-index-nexmeta-snips?mode=backup-worker"             -o /tmp/snips.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/snips.json'))
          print(json.dumps(d,ensure_ascii=False,indent=2)[:180000])
          PY

