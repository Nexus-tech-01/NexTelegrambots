name: NexStick source inspect

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ops-nexstick-source-inspect.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read safe Pterodactyl startup diagnostics
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error             "https://ojbyvjqurlamplmujmyu.supabase.co/functions/v1/nxc-ptero-read-nexmeta-runtime-once"             -o /tmp/runtime.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/runtime.json'))
          print(json.dumps(d,ensure_ascii=False,indent=2)[:120000])
          PY

# nexstick-safe-startup-diagnostic-20261003
