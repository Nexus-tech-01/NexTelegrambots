name: NexStick source inspect

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ops-nexstick-source-inspect.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read live NexStick bridge files
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error             "https://ojbyvjqurlamplmujmyu.supabase.co/functions/v1/nxc-ptero-browser-files-probe?root=%2Fnexus-bridge"             -o /tmp/bridge.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/bridge.json'))
          wanted={
            '/nexus-bridge/adapters/nexstick.mjs',
            '/nexus-bridge/adapter-loader.mjs',
            '/nexus-bridge/pterodactyl-runtime.mjs'
          }
          for x in d.get('fileList') or []:
              if x.get('path') in wanted:
                  print('\n=== '+x['path']+' ===')
                  print(x.get('content') or '<no content>')
          PY

# trigger-watermark-final
