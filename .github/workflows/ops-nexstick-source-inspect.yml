name: NexStick source inspect

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ops-nexstick-source-inspect.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read Pterodactyl startup console
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error             "https://ojbyvjqurlamplmujmyu.supabase.co/functions/v1/nxc-ptero-console-live"             -o /tmp/console.json
          python3 - <<'PY'
          import json
          c=json.load(open('/tmp/console.json'))
          print('OK',c.get('ok'),'STATE',c.get('state'))
          for line in c.get('logs') or []:
              print(line)
          PY

