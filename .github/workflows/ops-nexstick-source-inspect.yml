name: NexStick source inspect

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ops-nexstick-source-inspect.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: List live NexStick files
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            "https://ojbyvjqurlamplmujmyu.supabase.co/functions/v1/nxc-ptero-browser-files-probe?root=%2Fapp%2Fbots%2Fnexstick" \
            -o /tmp/nexstick.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/nexstick.json'))
          for x in d.get('fileList') or []:
              p=x.get('path') or ''
              if p:
                  print(p)
          PY
