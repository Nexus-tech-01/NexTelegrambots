name: NexStick source inspect

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ops-nexstick-source-inspect.yml"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rehydrate production source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ops-results/nexstick-source /tmp/nexus-bots
          mkdir -p /tmp/nexus-bots ops-results/nexstick-source
          : > /tmp/nexus-bots.tar.xz
          for f in $(printf '%s\n' render-src.b64.part-* | sort); do
            base64 -d "$f" >> /tmp/nexus-bots.tar.xz
          done
          xz -t /tmp/nexus-bots.tar.xz
          tar -xJf /tmp/nexus-bots.tar.xz -C /tmp/nexus-bots ./bots/nexstick
          cp -a /tmp/nexus-bots/bots/nexstick/. ops-results/nexstick-source/
          find ops-results/nexstick-source -maxdepth 4 -type f -print | sort > ops-results/nexstick-source-files.txt
      - name: Commit temporary inspection copy
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "nextech-ops"
          git config user.email "actions@users.noreply.github.com"
          git add ops-results/nexstick-source ops-results/nexstick-source-files.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ops: expose NexStick source for watermark patch [skip ci]"
          git push origin HEAD:main
