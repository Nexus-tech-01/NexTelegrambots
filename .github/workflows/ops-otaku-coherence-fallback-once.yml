name: Ops Otaku Coherence Fallback Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-otaku-coherence-fallback-once.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Apply isolated Otaku Nexus coherence patch
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --max-time 180 \
            "https://ojbyvjqurlamplmujmyu.supabase.co/functions/v1/nxc-ptero-console-once" |
          tee /tmp/result.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/result.json'))
          if d.get('ok') is not True:
              raise SystemExit('Otaku fallback deploy did not verify successfully')
          print('OTAKU_COHERENCE_DEPLOY_OK')
          print(json.dumps(d,ensure_ascii=False,indent=2))
          PY

