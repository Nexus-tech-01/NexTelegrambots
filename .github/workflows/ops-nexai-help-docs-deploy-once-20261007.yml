name: Ops NexAI Bilingual Help Deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-nexai-help-docs-deploy-once-20261007.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ops-nexai-bilingual-help-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate bilingual help source
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix nexaccount --ignore-scripts
          node --check nexaccount/config.mjs
          node --check nexaccount/daemon.mjs
          node --check nexaccount/help-docs.mjs
          node --check nexaccount/inline-bot.mjs
          node --check nexaccount/runtime.mjs
          node --check nexaccount/cli.mjs
          node --check ops/deploy-nexai-safe-hotfix-live.mjs
          grep -F "Nextech_NexAi" nexaccount/config.mjs
          grep -F "export async function syncHelpDocs" nexaccount/help-docs.mjs
          grep -F "export async function helpDocLink" nexaccount/help-docs.mjs
          grep -F "sendCommandHelp" nexaccount/inline-bot.mjs
          grep -F "case 'help':{" nexaccount/runtime.mjs
          grep -F "case 'help-sync':" nexaccount/cli.mjs
          grep -F "case 'help-link':" nexaccount/cli.mjs
          grep -F "'help-docs':[" ops/deploy-nexai-safe-hotfix-live.mjs
          grep -F "report.steps.helpDocs={" ops/deploy-nexai-safe-hotfix-live.mjs

      - name: Deploy bilingual help to NexAI VPS
        shell: bash
        env:
          DEPLOY_ENDPOINT: https://ojbyvjqurlamplmujmyu.supabase.co/functions/v1/nxc-agent-hotfix-bridge
        run: |
          set -euo pipefail
          OIDC_JSON="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=nxc-nexai-help-docs-deploy")"
          OIDC_TOKEN="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$OIDC_JSON")"
          test -n "$OIDC_TOKEN"

          curl --fail-with-body --silent --show-error --max-time 1050 \
            -X POST "$DEPLOY_ENDPOINT" \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            --data "{\"sha\":\"${GITHUB_SHA}\",\"mode\":\"help-docs\"}" \
            | tee /tmp/nexai-help-docs-deploy.json

          python3 - <<'PY'
          import json,re
          from pathlib import Path
          d=json.loads(Path('/tmp/nexai-help-docs-deploy.json').read_text())
          if d.get('ok') is not True:
              raise SystemExit('deployment failed: '+str(d))
          steps=d.get('steps') or {}
          if steps.get('sourceValidated') is not True:
              raise SystemExit('source validation not confirmed')
          if steps.get('productionMarker') is not True:
              raise SystemExit('production marker not confirmed')
          health=steps.get('health') or {}
          if health.get('ok') is not True or health.get('pairingOnly') is True:
              raise SystemExit('NexAI health not confirmed: '+str(health))
          live=steps.get('live') or {}
          docs=live.get('helpDocs') or {}
          if docs.get('channel')!='@Nextech_NexAi':
              raise SystemExit('official help channel not confirmed: '+str(docs))
          sync=docs.get('sync') or {}
          if sync.get('ok') is not True or int(sync.get('failed') or 0)!=0 or int(sync.get('total') or 0)<2:
              raise SystemExit('FR/EN synchronization failed: '+str(sync))
          probe=docs.get('routeProbe') or {}
          if probe.get('ok') is not True or probe.get('command')!='help':
              raise SystemExit('help command route failed: '+str(probe))
          links=docs.get('links') or {}
          pat=re.compile(r'^https://t\.me/Nextech_NexAi/\d+$',re.I)
          if not pat.match(str(links.get('fr') or '')) or not pat.match(str(links.get('en') or '')):
              raise SystemExit('published help links invalid: '+str(links))
          ids=docs.get('messageIds') or {}
          if not int(ids.get('fr') or 0) or not int(ids.get('en') or 0) or int(ids['fr'])==int(ids['en']):
              raise SystemExit('FR and EN posts are not distinct: '+str(ids))
          print('NEXAI_BILINGUAL_HELP_PRODUCTION_OK')
          print('HELP_TOTAL',sync.get('total'))
          print('HELP_CREATED',sync.get('created'))
          print('HELP_EDITED',sync.get('edited'))
          print('HELP_UNCHANGED',sync.get('unchanged'))
          print('HELP_FR_URL',links.get('fr'))
          print('HELP_EN_URL',links.get('en'))
          PY
