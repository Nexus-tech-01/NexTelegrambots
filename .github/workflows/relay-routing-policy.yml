name: Relay routing policy checks
on:
  pull_request:
    paths:
      - 'whatsapp-publisher/server.mjs'
      - 'whatsapp-publisher/test/routing-policy.test.mjs'
      - 'nexcanal/nextech-whatsapp-mirror.mjs'
      - '.github/workflows/relay-routing-policy.yml'
  push:
    branches: [main]
    paths:
      - 'whatsapp-publisher/server.mjs'
      - 'whatsapp-publisher/test/routing-policy.test.mjs'
      - 'nexcanal/nextech-whatsapp-mirror.mjs'
      - '.github/workflows/relay-routing-policy.yml'
permissions:
  contents: read
jobs:
  routing-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and routing tests
        run: |
          node --check whatsapp-publisher/server.mjs
          node --check nexcanal/nextech-whatsapp-mirror.mjs
          node --test whatsapp-publisher/test/routing-policy.test.mjs
