name: Render bundle smoke

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  bundle-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inspect canonical chunk encoding
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t parts < <(printf '%s\n' render-src.b64.part-* | sort)
          printf 'part_count=%s\n' "${#parts[@]}"
          test "${#parts[@]}" -eq 9
          total=0
          for part in "${parts[@]}"; do
            size=$(wc -c < "$part")
            clean_size=$(tr -d '\r\n' < "$part" | wc -c)
            invalid=$(LC_ALL=C tr -d 'A-Za-z0-9+/=\r\n' < "$part" | wc -c)
            printf '%s bytes=%s clean=%s mod4=%s invalid=%s prefix=' "$part" "$size" "$clean_size" "$((clean_size % 4))" "$invalid"
            head -c 8 "$part"
            printf ' suffix='
            tail -c 8 "$part"
            printf '\n'
            total=$((total + clean_size))
          done
          printf 'total_clean=%s total_mod4=%s\n' "$total" "$((total % 4))"

      - name: Reconstruct tolerant base64 stream
        shell: bash
        run: |
          set -euo pipefail
          cat render-src.b64.part-* | tr -d '\r\n' > /tmp/nexus-bots.b64
          printf 'combined_bytes=%s mod4=%s\n' "$(wc -c < /tmp/nexus-bots.b64)" "$(( $(wc -c < /tmp/nexus-bots.b64) % 4 ))"
          base64 --decode --ignore-garbage /tmp/nexus-bots.b64 > /tmp/nexus-bots.tar.xz
          xz -t /tmp/nexus-bots.tar.xz
          tar -tJf /tmp/nexus-bots.tar.xz > /tmp/archive-files.txt
          printf 'archive_file_count=%s\n' "$(wc -l < /tmp/archive-files.txt)"
          for required in \
            './scripts/orchestrator.mjs' \
            './scripts/preflight.mjs' \
            './scripts/install-all.mjs' \
            './scripts/build-all.mjs' \
            './bots/nexdownloader/requirements.txt'; do
            grep -Fxq "$required" /tmp/archive-files.txt
          done

      - name: Extract and verify five bot directories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/nexus-app
          tar -xJf /tmp/nexus-bots.tar.xz -C /tmp/nexus-app
          for bot in nexgame nexcanal nexdownloader nexgroup nexstick; do
            test -d "/tmp/nexus-app/bots/$bot"
            printf '%s=present\n' "$bot"
          done
