name: Render bundle smoke

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  bundle-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Diagnose both reconstruction modes
        shell: bash
        run: |
          set -u
          test_bundle() {
            label="$1"
            pattern="$2"
            text="/tmp/${label}-concat.b64"
            one="/tmp/${label}-decode-once.tar.xz"
            each="/tmp/${label}-decode-each.tar.xz"
            : > "$text"; : > "$each"
            count=0
            for part in $(printf '%s\n' $pattern | sort); do
              [ -f "$part" ] || continue
              count=$((count+1))
              tr -d '\r\n' < "$part" >> "$text"
              base64 --decode "$part" >> "$each" 2>/dev/null || true
            done
            rem=$(( $(wc -c < "$text") % 4 ))
            if [ "$rem" -ne 0 ]; then printf '%*s' "$((4-rem))" '' | tr ' ' '=' >> "$text"; fi
            base64 --decode "$text" > "$one" 2>/dev/null || true
            echo "${label}_parts=${count}"
            for mode in decode-once decode-each; do
              file="/tmp/${label}-${mode}.tar.xz"
              set +e
              xz -t "$file" >/dev/null 2>&1
              ok=$?
              set -e
              echo "${label}_${mode}_xz_status=${ok}"
              dir="/tmp/${label}-${mode}-recover"
              mkdir -p "$dir"
              set +e
              xz -dc "$file" 2>/dev/null | tar -x -C "$dir" 2>/dev/null
              extract=$?
              set -e
              echo "${label}_${mode}_partial_extract_status=${extract}"
              for f in scripts/orchestrator.mjs scripts/preflight.mjs scripts/install-all.mjs scripts/build-all.mjs; do
                if [ -f "$dir/$f" ]; then echo "${label}_${mode}_${f}=present"; else echo "${label}_${mode}_${f}=missing"; fi
              done
              for bot in nexgame nexcanal nexdownloader nexgroup nexstick nexcanal-manager nexgroup-manager; do
                if [ -d "$dir/bots/$bot" ]; then
                  echo "${label}_${mode}_${bot}_files=$(find "$dir/bots/$bot" -type f | wc -l)"
                else
                  echo "${label}_${mode}_${bot}_files=0"
                fi
              done
              echo "${label}_${mode}_total_files=$(find "$dir" -type f | wc -l)"
            done
          }

          test_bundle canonical 'render-src.b64.part-*'
          test_bundle legacy 'nexus-bots-src.tar.xz.b64.part-*'

      - name: Keep validation red until a bundle is fully valid
        shell: bash
        run: exit 1
