name: Render bundle smoke

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  bundle-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate canonical parts 00 through 07
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object render-src.b64.part-07)" = "$(git hash-object render-src.b64.part-08)"
          cat render-src.b64.part-0{0,1,2,3,4,5,6,7} | tr -d '\r\n' > /tmp/canonical.b64
          rem=$(( $(wc -c < /tmp/canonical.b64) % 4 ))
          if [ "$rem" -ne 0 ]; then printf '%*s' "$((4-rem))" '' | tr ' ' '=' >> /tmp/canonical.b64; fi
          base64 --decode /tmp/canonical.b64 > /tmp/nexus-bots.tar.xz
          xz -t /tmp/nexus-bots.tar.xz
          tar -tJf /tmp/nexus-bots.tar.xz > /tmp/archive-files.txt
          printf 'archive_file_count=%s\n' "$(wc -l < /tmp/archive-files.txt)"
          head -n 10 /tmp/archive-files.txt
          tail -n 20 /tmp/archive-files.txt

      - name: Verify runtime and five bots
        shell: bash
        run: |
          set -euo pipefail
          for required in \
            'package.json' \
            'scripts/orchestrator.mjs' \
            'scripts/preflight.mjs' \
            'scripts/install-all.mjs' \
            'scripts/build-all.mjs'; do
            grep -Fxq "$required" /tmp/archive-files.txt
            echo "$required=present"
          done
          for pattern in \
            'bots/nexcanal-manager/' \
            'bots/nexdownloader/' \
            'bots/nexgame/' \
            'bots/nexgroup-manager/' \
            'bots/nexstick/'; do
            grep -q "^${pattern}" /tmp/archive-files.txt
            echo "$pattern=present"
          done

      - name: Extract source and run production build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/nexus-app
          tar -xJf /tmp/nexus-bots.tar.xz -C /tmp/nexus-app
          cd /tmp/nexus-app
          node scripts/install-all.mjs
          node scripts/build-all.mjs
