name: Render bundle smoke

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  bundle-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Recover readable legacy tar prefix
        shell: bash
        run: |
          set +e
          cat nexus-bots-src.tar.xz.b64.part-* | tr -d '\r\n' | base64 --decode > /tmp/legacy.tar.xz
          xz -dc /tmp/legacy.tar.xz > /tmp/legacy-recovered.tar 2>/tmp/legacy-xz.err
          printf 'legacy_decompress_rc=%s recovered_bytes=%s\n' "$?" "$(wc -c < /tmp/legacy-recovered.tar)"
          cat /tmp/legacy-xz.err || true
          tar -tf /tmp/legacy-recovered.tar > /tmp/legacy-files.txt 2>/tmp/legacy-tar.err
          printf 'legacy_tar_rc=%s recovered_entries=%s\n' "$?" "$(wc -l < /tmp/legacy-files.txt)"
          tail -n 30 /tmp/legacy-files.txt || true
          cat /tmp/legacy-tar.err || true
          for bot in nexgame nexcanal nexdownloader nexgroup nexstick; do
            grep -q "^./bots/$bot/" /tmp/legacy-files.txt && echo "legacy_$bot=present" || echo "legacy_$bot=missing"
          done
          for required in './scripts/orchestrator.mjs' './scripts/preflight.mjs' './scripts/install-all.mjs' './scripts/build-all.mjs'; do
            grep -Fxq "$required" /tmp/legacy-files.txt && echo "legacy_$required=present" || echo "legacy_$required=missing"
          done
          exit 0

      - name: Recover readable canonical tar prefix
        shell: bash
        run: |
          set +e
          cat render-src.b64.part-* | tr -d '\r\n' > /tmp/canonical.b64
          rem=$(( $(wc -c < /tmp/canonical.b64) % 4 ))
          if [ "$rem" -ne 0 ]; then printf '%*s' "$((4-rem))" '' | tr ' ' '=' >> /tmp/canonical.b64; fi
          base64 --decode /tmp/canonical.b64 > /tmp/canonical.tar.xz 2>/tmp/canonical-b64.err
          printf 'canonical_base64_rc=%s encoded_bytes=%s\n' "$?" "$(wc -c < /tmp/canonical.b64)"
          cat /tmp/canonical-b64.err || true
          xz -dc /tmp/canonical.tar.xz > /tmp/canonical-recovered.tar 2>/tmp/canonical-xz.err
          printf 'canonical_decompress_rc=%s recovered_bytes=%s\n' "$?" "$(wc -c < /tmp/canonical-recovered.tar)"
          cat /tmp/canonical-xz.err || true
          tar -tf /tmp/canonical-recovered.tar > /tmp/canonical-files.txt 2>/tmp/canonical-tar.err
          printf 'canonical_tar_rc=%s recovered_entries=%s\n' "$?" "$(wc -l < /tmp/canonical-files.txt)"
          tail -n 30 /tmp/canonical-files.txt || true
          cat /tmp/canonical-tar.err || true
          for bot in nexgame nexcanal nexdownloader nexgroup nexstick; do
            grep -q "^./bots/$bot/" /tmp/canonical-files.txt && echo "canonical_$bot=present" || echo "canonical_$bot=missing"
          done
          for required in './scripts/orchestrator.mjs' './scripts/preflight.mjs' './scripts/install-all.mjs' './scripts/build-all.mjs'; do
            grep -Fxq "$required" /tmp/canonical-files.txt && echo "canonical_$required=present" || echo "canonical_$required=missing"
          done
          exit 0
