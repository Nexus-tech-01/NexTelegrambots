name: Render bundle smoke

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  bundle-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Diagnose recoverable source content
        shell: bash
        run: |
          set -u
          diagnose() {
            label="$1"
            pattern="$2"
            out="/tmp/${label}.tar.xz"
            dir="/tmp/${label}-recover"
            : > "$out"
            count=0
            for part in $(printf '%s\n' $pattern | sort); do
              [ -f "$part" ] || continue
              count=$((count+1))
              base64 --decode "$part" >> "$out" || true
            done
            echo "${label}_parts=${count}"
            xz -t "$out" >/dev/null 2>&1; echo "${label}_xz_ok=$?"
            mkdir -p "$dir"
            set +e
            xz -dc "$out" 2>/tmp/${label}-xz.err | tar -x -C "$dir" 2>/tmp/${label}-tar.err
            pipe_status=$?
            set -e
            echo "${label}_partial_extract_status=${pipe_status}"
            for f in scripts/orchestrator.mjs scripts/preflight.mjs scripts/install-all.mjs scripts/build-all.mjs; do
              if [ -f "$dir/$f" ]; then echo "${label}_${f}=present"; else echo "${label}_${f}=missing"; fi
            done
            for bot in nexgame nexcanal nexdownloader nexgroup nexstick nexcanal-manager nexgroup-manager; do
              if [ -d "$dir/bots/$bot" ]; then
                echo "${label}_${bot}_files=$(find "$dir/bots/$bot" -type f | wc -l)"
              else
                echo "${label}_${bot}_files=0"
              fi
            done
            echo "${label}_total_files=$(find "$dir" -type f | wc -l)"
          }

          diagnose canonical 'render-src.b64.part-*'
          diagnose legacy 'nexus-bots-src.tar.xz.b64.part-*'

      - name: Fail until canonical archive is fully valid
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/nexus-bots.tar.xz
          for part in $(printf '%s\n' render-src.b64.part-* | sort); do
            base64 --decode "$part" >> /tmp/nexus-bots.tar.xz
          done
          xz -t /tmp/nexus-bots.tar.xz
