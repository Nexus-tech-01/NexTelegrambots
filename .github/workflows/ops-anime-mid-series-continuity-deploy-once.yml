# trigger metadata-stall recovery 2026-10-04
# trigger whatsapp-stage-crash-fix 2026-10-04
# trigger previous-link-fix 2026-10-04
# refresh anime candidate scan
# runtime stall recovery
# resume-synopsis deploy refresh
# resume-synopsis fallback refresh
# formatted-resume-synopsis refresh
name: Ops Anime Safe Recovery Deploy Once
# deploy refresh 2026-10-04

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-anime-mid-series-continuity-deploy-once.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: ops-anime-safe-recovery-deploy-once
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate NexAnime recovery patch
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix nexaccount --ignore-scripts
          node --check nexaccount/anime-ingest.mjs
          node --check nexaccount/bootstrap.mjs
          node --check ops/deploy-nexai-safe-hotfix-live.mjs
          node nexaccount/scripts/test-anime-ingest.mjs
          grep -F "and continuing with another runnable series" nexaccount/anime-ingest.mjs
          grep -F "refusing auxiliary production runtime" nexaccount/bootstrap.mjs

      - name: Deploy through single-runtime safe bridge
        shell: bash
        env:
          DEPLOY_ENDPOINT: https://ojbyvjqurlamplmujmyu.supabase.co/functions/v1/nxc-agent-hotfix-bridge
        run: |
          set -euo pipefail
          OIDC_JSON="$(curl --fail-with-body --silent --show-error             -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=nxc-nexanime-safe-deploy")"
          OIDC_TOKEN="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$OIDC_JSON")"
          body="$(curl --fail-with-body --silent --show-error --max-time 330             -X POST "$DEPLOY_ENDPOINT"             -H "Authorization: Bearer $OIDC_TOKEN"             -H "Content-Type: application/json"             --data "{\"sha\":\"${GITHUB_SHA}\",\"mode\":\"anime-gap-skip\"}")"
          echo "$body"
          python3 - "$body" <<'PY'
          import json,sys
          d=json.loads(sys.argv[1])
          if d.get("ok") is not True:
              raise SystemExit("safe deploy failed: "+str(d))
          steps=d.get("steps") or {}
          if steps.get("safeSingleRuntime") is not True:
              raise SystemExit("single-runtime protection missing: "+str(steps))
          live=steps.get("live") or {}
          anime=live.get("anime") or {}
          if anime.get("ok") is not True or anime.get("enabled") is not True:
              raise SystemExit("NexAnime live verification failed: "+str(anime))
          print("NEXANIME_SAFE_RECOVERY_OK")
          PY
