name: Deploy NexDownloader v61.11

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-nexdownloader-v61-11.yml'

permissions:
  contents: read

concurrency:
  group: deploy-nexdownloader-v61-11
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NXC_BASE: https://nexcontrol-ochre.vercel.app
      NXC_AGENT: nexus-main
      NXC_ROOT: nexdownloader
      NXC_ADMIN_PASSWORD: ${{ secrets.NEXCONTROL_ADMIN_PASSWORD || secrets.ADMIN_PASSWORD }}
      NXC_SESSION_SECRET: ${{ secrets.NEXCONTROL_SESSION_SECRET || secrets.SESSION_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy and verify NexDownloader v1.56.0
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, json, time, base64, gzip, urllib.request, urllib.error, urllib.parse, traceback, http.cookiejar, hmac, hashlib
          from pathlib import Path

          BASE=os.environ['NXC_BASE'].rstrip('/')
          AGENT=os.environ['NXC_AGENT']
          ROOT=os.environ['NXC_ROOT']
          ADMIN=os.environ.get('NXC_ADMIN_PASSWORD','')
          SESSION_SECRET=os.environ.get('NXC_SESSION_SECRET','')
          encoded=Path('.deploy/nexdownloader-v61.11.manifest.b64').read_text().strip()
          manifest=json.loads(gzip.decompress(base64.b64decode(encoded)))
          backups=[]
          restarted=False

          jar=http.cookiejar.CookieJar()
          opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          session_cookie=''

          if SESSION_SECRET:
              exp=int(time.time()*1000)+20*60*1000
              payload=base64.urlsafe_b64encode(json.dumps({'exp':exp},separators=(',',':')).encode()).decode().rstrip('=')
              sig=base64.urlsafe_b64encode(hmac.new(SESSION_SECRET.encode(),payload.encode(),hashlib.sha256).digest()).decode().rstrip('=')
              session_cookie=payload+'.'+sig
              print('auth: session secret',flush=True)
          elif ADMIN:
              data=urllib.parse.urlencode({'password':ADMIN}).encode()
              req=urllib.request.Request(BASE+'/api/admin/login',data=data,headers={'Content-Type':'application/x-www-form-urlencoded'},method='POST')
              try:
                  opener.open(req,timeout=45).read()
              except urllib.error.HTTPError as e:
                  raise RuntimeError('NexControl login failed: HTTP '+str(e.code))
              print('auth: admin password',flush=True)
          else:
              raise RuntimeError('No NexControl credential is configured in GitHub Actions secrets.')

          def http(method,path,data=None):
              headers={'Accept':'application/json'}
              if session_cookie:
                  headers['Cookie']='nexcontrol_session='+session_cookie
              body=None
              if data is not None:
                  body=json.dumps(data,separators=(',',':')).encode()
                  headers['Content-Type']='application/json'
              req=urllib.request.Request(BASE+path,data=body,headers=headers,method=method)
              try:
                  with opener.open(req,timeout=45) as r:
                      raw=r.read().decode('utf-8','replace')
                      return r.status, json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  raw=e.read().decode('utf-8','replace')
                  raise RuntimeError(f'HTTP {e.code} {path}: {raw[:1200]}')

          def create_job(kind,payload):
              _,j=http('POST','/api/admin/agent/jobs',{'agentSlug':AGENT,'kind':kind,'payload':payload})
              jid=j.get('jobId')
              if not jid:
                  raise RuntimeError(f'No jobId for {kind}: {j}')
              print(f'created {kind} {jid}',flush=True)
              return jid

          def wait_job(jid,timeout=180):
              end=time.time()+timeout
              while time.time()<end:
                  _,j=http('GET','/api/admin/agent/jobs?id='+urllib.parse.quote(jid))
                  st=j.get('status')
                  if st=='succeeded':
                      print(f'succeeded {j.get("kind")} {jid}',flush=True)
                      return j.get('result') or {}
                  if st=='failed':
                      raise RuntimeError(f'job {jid} failed: {j.get("error")}')
                  time.sleep(2)
              raise TimeoutError(f'job {jid} timed out')

          def run(kind,payload,timeout=180):
              return wait_job(create_job(kind,payload),timeout)

          def rollback():
              print('rolling back changed files...',flush=True)
              for item in reversed(backups):
                  try:
                      if item.get('backupId'):
                          run('fs.rollback',{'backupId':item['backupId']},120)
                      elif item.get('created'):
                          run('fs.delete',{'root':ROOT,'path':item['path'],'allowDir':False},120)
                  except Exception as e:
                      print('rollback warning:',e,flush=True)
              if restarted:
                  try:
                      run('runtime.restart',{'target':'nexdownloader','reason':'Automatic rollback after failed v61.11 deployment'},120)
                  except Exception as e:
                      print('rollback restart warning:',e,flush=True)

          try:
              probe=run('fs.list',{'root':ROOT,'path':'.'},120)
              print('agent/root probe ok; entries=',len(probe.get('items',[])),flush=True)

              before=run('fs.read',{'root':ROOT,'path':'package.json','startLine':1,'endLine':80},120)
              print('before package:',before.get('content','')[:500].replace('\n',' '),flush=True)

              for item in manifest:
                  content=base64.b64decode(item['b64']).decode('utf-8')
                  result=run('fs.write',{'root':ROOT,'path':item['path'],'content':content},180)
                  backups.append({'path':item['path'],'backupId':result.get('backupId'),'created':result.get('created',False)})

              for f in [
                  'src/download/builtin-api-providers.js',
                  'src/download/platforms.js',
                  'src/jobs/processor.js',
                  'src/runtime/checks.js',
                  'tests/v108-tiktok-september-recovery.test.js',
                  'tests/v83-self-bootstrap.test.js',
                  'tests/v87-runtime-recovery.test.js',
              ]:
                  result=run('check.run',{'check':'node-check','root':ROOT,'file':f,'timeoutMs':60000},120)
                  if not result.get('ok',False):
                      raise RuntimeError(f'node-check failed for {f}: {result}')

              test=run('check.run',{'check':'npm-test','root':ROOT,'timeoutMs':120000},170)
              if not test.get('ok',False):
                  raise RuntimeError('npm test failed: '+json.dumps(test)[:5000])
              print('npm test passed',flush=True)

              after=run('fs.read',{'root':ROOT,'path':'package.json','startLine':1,'endLine':80},120)
              if '"version": "1.56.0"' not in after.get('content',''):
                  raise RuntimeError('version verification failed')

              run('runtime.restart',{'target':'nexdownloader','reason':'Deploy NexDownloader v1.56.0 / fleet v61.11 TikTok September Recovery'},120)
              restarted=True
              print('restart requested; waiting for launcher',flush=True)
              time.sleep(12)

              try:
                  logs=run('logs.tail',{'log':'launcher','bytes':120000},120)
                  tail=logs.get('content','')
                  print('launcher tail (last 8000 chars):\n'+tail[-8000:],flush=True)
              except Exception as e:
                  print('log tail warning:',e,flush=True)

              print('DEPLOYMENT_OK NexDownloader 1.56.0 / fleet 61.11',flush=True)
          except Exception:
              traceback.print_exc()
              rollback()
              raise
          PY
