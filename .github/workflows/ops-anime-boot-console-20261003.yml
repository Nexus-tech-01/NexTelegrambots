name: Ops Anime Boot Console 2026-10-03

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-anime-boot-console-20261003.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Safely prune caches and stale temporary media
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error             "https://ojbyvjqurlamplmujmyu.supabase.co/functions/v1/nxc-safe-cache-clean-once"
          echo
      - name: Restore canonical startup and start server
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error             "https://ojbyvjqurlamplmujmyu.supabase.co/functions/v1/nxc-ptero-mainfile-repair"
          echo
      - name: Verify Pterodactyl and NexAnime runtime
        shell: bash
        run: |
          sleep 25
          curl --fail-with-body --silent --show-error             "https://ojbyvjqurlamplmujmyu.supabase.co/functions/v1/nxc-ptero-diag"
          echo
