name: Ops Anime Boot Console 2026-10-03

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-anime-boot-console-20261003.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Start server and capture live boot console
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error             "https://ojbyvjqurlamplmujmyu.supabase.co/functions/v1/nxc-chatgpt-console-once"
          echo
      - name: Verify runtime state after boot attempt
        shell: bash
        run: |
          sleep 8
          curl --fail-with-body --silent --show-error             "https://ojbyvjqurlamplmujmyu.supabase.co/functions/v1/nxc-ptero-diag"
          echo
