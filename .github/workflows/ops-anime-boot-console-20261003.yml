name: Ops NexAI Session Diagnostic 2026-10-04

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-anime-boot-console-20261003.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fleet process snapshot
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error "https://ojbyvjqurlamplmujmyu.supabase.co/functions/v1/nxc-chatgpt-diag-once"
          echo
      - name: NexAccount session health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error "https://ojbyvjqurlamplmujmyu.supabase.co/functions/v1/nxc-nexmeta-session-health-probe"
          echo
      - name: Pterodactyl residual runtime snapshot
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error "https://ojbyvjqurlamplmujmyu.supabase.co/functions/v1/nxc-ptero-read-nexmeta-runtime-once"
          echo
