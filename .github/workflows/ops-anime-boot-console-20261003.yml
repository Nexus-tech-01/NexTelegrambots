name: Ops Anime Boot Console 2026-10-03

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-anime-boot-console-20261003.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Capture live Pterodactyl console after recovery
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error             "https://ojbyvjqurlamplmujmyu.supabase.co/functions/v1/nxc-ptero-console-live"
          echo
      - name: Verify running state
        shell: bash
        run: |
          sleep 8
          curl --fail-with-body --silent --show-error             "https://ojbyvjqurlamplmujmyu.supabase.co/functions/v1/nxc-ptero-diag"
          echo
