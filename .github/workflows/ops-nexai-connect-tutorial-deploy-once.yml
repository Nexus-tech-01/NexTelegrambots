# settutorial resilient deploy 2026-10-03
# deploy tutorial storage bot fallback 2026-10-03
# deploy HQ tutorial video 2026-10-03
name: Ops NexAI Connection Tutorial Deploy Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-nexai-connect-tutorial-deploy-once.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: ops-nexai-connect-tutorial-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Validate NexAI connection tutorial source
        shell: bash
        run: |
          set -euo pipefail
          node --check nexaccount/inline-bot.mjs
          node --check nexaccount/reply-storage.mjs
          grep -F "CONNECT_TUTORIAL_CALLBACK" nexaccount/inline-bot.mjs
          grep -F "connect:tutorial" nexaccount/inline-bot.mjs
          grep -F "🎬 Voir le tuto" nexaccount/inline-bot.mjs
          grep -F "sendConnectTutorial" nexaccount/inline-bot.mjs
          grep -F "storeReplyVideo" nexaccount/inline-bot.mjs
          grep -F "filenamePrefix" nexaccount/reply-storage.mjs

      - name: Deploy connection tutorial to NexAI VPS
        shell: bash
        env:
          DEPLOY_ENDPOINT: https://ojbyvjqurlamplmujmyu.supabase.co/functions/v1/nxc-agent-hotfix-bridge
        run: |
          set -euo pipefail
          OIDC_JSON="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=nxc-nexai-inline-tutorial-deploy")"
          OIDC_TOKEN="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$OIDC_JSON")"
          test -n "$OIDC_TOKEN"

          curl --fail-with-body --silent --show-error \
            -X POST "$DEPLOY_ENDPOINT" \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            --data "{\"sha\":\"${GITHUB_SHA}\",\"mode\":\"inline-tutorial\"}" \
            | tee /tmp/nexai-connect-tutorial-deploy.json

          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/nexai-connect-tutorial-deploy.json').read_text())
          if d.get('ok') is not True:
              raise SystemExit('deployment failed: '+str(d))
          steps=d.get('steps') or {}
          if steps.get('sourceValidated') is not True:
              raise SystemExit('source validation not confirmed')
          if steps.get('productionMarker') is not True:
              raise SystemExit('production marker not confirmed')
          health=steps.get('health') or {}
          if health.get('ok') is not True or health.get('pairingOnly') is True:
              raise SystemExit('NexAI health not confirmed: '+str(health))
          print('NEXAI_CONNECTION_TUTORIAL_PRODUCTION_OK')
          PY
