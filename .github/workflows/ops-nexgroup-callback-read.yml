name: NexGroup Callback Read

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-nexgroup-callback-read.yml'

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Read live callback guard
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error             "https://ojbyvjqurlamplmujmyu.supabase.co/functions/v1/nxc-agent-hotfix-bridge" |
          python3 -c 'import sys,json; print(json.dumps(json.load(sys.stdin),ensure_ascii=False,indent=2))'
