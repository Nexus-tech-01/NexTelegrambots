# redeploy: remove personal style label beside bot name
# retry with nested backup path support
# retry with current menu regression test + runtime warmup
# retry after new-file rollback support
# deploy prefixless custom-style commands + botname recursion fix
name: Ops NexAI Custom Style Deploy Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-nexai-custom-style-deploy-once.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: ops-nexai-custom-style-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate custom style source
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix nexaccount --ignore-scripts
          node --check nexaccount/custom-style.mjs
          node --check nexaccount/store.mjs
          node --check nexaccount/commands.mjs
          node --check nexaccount/runtime.mjs
          node --check nexaccount/compat.mjs
          node --check nexaccount/menu.mjs
          node --check nexaccount/inline-bot.mjs
          node nexaccount/scripts/test-menu-resilience.mjs
          grep -F "customStyleModel" nexaccount/menu.mjs
          grep -F "C('customstyle'" nexaccount/commands.mjs
          grep -F "registered.hidden!==true" nexaccount/runtime.mjs
          grep -F "cacheMenuMediaForBot" nexaccount/compat.mjs
          grep -F "bot.command('menuvideo'" nexaccount/inline-bot.mjs
          grep -F "inlineCachedMediaResult" nexaccount/inline-bot.mjs

      - name: Deploy custom styles to NexAI VPS
        shell: bash
        env:
          DEPLOY_ENDPOINT: https://ojbyvjqurlamplmujmyu.supabase.co/functions/v1/nxc-agent-hotfix-bridge
        run: |
          set -euo pipefail
          OIDC_JSON="$(curl --fail-with-body --silent --show-error             -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=nxc-nexai-custom-style-deploy")"
          OIDC_TOKEN="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$OIDC_JSON")"
          test -n "$OIDC_TOKEN"

          curl --fail-with-body --silent --show-error --max-time 420             -X POST "$DEPLOY_ENDPOINT"             -H "Authorization: Bearer $OIDC_TOKEN"             -H "Content-Type: application/json"             --data "{\"sha\":\"${GITHUB_SHA}\",\"mode\":\"custom-style\"}"             | tee /tmp/nexai-custom-style-deploy.json

          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/nexai-custom-style-deploy.json').read_text())
          if d.get('ok') is not True:
              raise SystemExit('deployment failed: '+str(d))
          steps=d.get('steps') or {}
          if steps.get('sourceValidated') is not True:
              raise SystemExit('source validation not confirmed')
          if steps.get('productionMarker') is not True:
              raise SystemExit('production marker not confirmed')
          health=steps.get('health') or {}
          if health.get('ok') is not True or health.get('pairingOnly') is True:
              raise SystemExit('NexAI health not confirmed: '+str(health))
          live=steps.get('live') or {}
          if live.get('menuTests') is not True:
              raise SystemExit('menu regression not confirmed: '+str(live))
          anime=live.get('anime') or {}
          if anime.get('ok') is not True or anime.get('enabled') is not True:
              raise SystemExit('NexAnime health not confirmed: '+str(anime))
          accounts=live.get('accounts') or {}
          if accounts.get('tresor20001') is not True or accounts.get('tresor20009') is not True:
              raise SystemExit('critical NexAI sessions not confirmed: '+str(accounts))
          probe=live.get('menuProbe') or {}
          if probe.get('ok') is not True or not probe.get('resultId'):
              raise SystemExit('NexAI menu probe failed: '+str(probe))
          print('NEXAI_CUSTOM_STYLE_PRODUCTION_OK')
          PY
