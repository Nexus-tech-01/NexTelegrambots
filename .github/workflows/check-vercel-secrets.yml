name: Check Vercel deploy capability

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-vercel-secrets.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check secret presence only
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          test -n "$VERCEL_TOKEN" && echo "VERCEL_TOKEN_present=true" || echo "VERCEL_TOKEN_present=false"
          test -n "$VERCEL_ORG_ID" && echo "VERCEL_ORG_ID_present=true" || echo "VERCEL_ORG_ID_present=false"
          test -n "$VERCEL_PROJECT_ID" && echo "VERCEL_PROJECT_ID_present=true" || echo "VERCEL_PROJECT_ID_present=false"

# probe: verify NexControl deploy credentials
