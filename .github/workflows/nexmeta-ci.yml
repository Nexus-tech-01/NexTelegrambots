name: NexMeta CI

on:
  push:
    branches:
      - feature/nexmeta-v1
    paths:
      - "nexmeta/**"
      - "nexcontrol/lib/nexmeta-client.mjs"
      - "nexcontrol/ui/meta-page.mjs"
      - "nexcontrol/api/index.mjs"
      - "nexus-bridge/**"
      - ".github/workflows/nexmeta-ci.yml"
  pull_request:
    paths:
      - "nexmeta/**"
      - "nexcontrol/lib/nexmeta-client.mjs"
      - "nexcontrol/ui/meta-page.mjs"
      - "nexcontrol/api/index.mjs"
      - "nexus-bridge/**"
      - ".github/workflows/nexmeta-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexmeta
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm test
      - run: node --test ../nexus-bridge/test/*.test.mjs
      - run: |
          node --check src/config.mjs
          node --check src/security.mjs
          node --check src/store.mjs
          node --check src/normalizer.mjs
          node --check src/token-vault.mjs
          node --check src/meta-oauth.mjs
          node --check src/meta-webhooks.mjs
          node --check src/meta-diagnostics.mjs
          node --check src/messenger-profile.mjs
          node --check src/meta-client.mjs
          node --check src/router.mjs
          node --check src/identity-link.mjs
          node --check src/processor.mjs
          node --check src/readiness.mjs
          node --check src/control-actions.mjs
          node --check src/handler.mjs
          node --check src/server.mjs
          node --check api/index.mjs
          node --check ../nexcontrol/lib/nexmeta-client.mjs
          node --check ../nexcontrol/ui/meta-page.mjs
          node --check ../nexcontrol/api/index.mjs
          node --check ../nexus-bridge/receiver.mjs
          node --check ../nexus-bridge/adapter-loader.mjs
          node --check ../nexus-bridge/gateway-wrapper.mjs
          node --check ../nexus-bridge/discover-bot-cores.mjs
